<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pelita — Fase 1 Pelarian Daud</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold-light:#e8c97a;--gold-dim:#8a6f30;--cream:#f0e6cf;--parchment:#d8c9a4;--ink:#0d0a04;--bg:#0d0a04;--panel:#191307;--panel2:#221a09;--border:#463713;--red:#a13a2a;--green:#5c8a3a;--green-light:#8fc46a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Crimson Pro',serif;background:var(--bg);color:var(--cream);position:fixed;inset:0;overscroll-behavior:none;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 30% 0%,rgba(201,168,76,.09) 0%,transparent 55%),radial-gradient(ellipse at 70% 100%,rgba(161,58,42,.07) 0%,transparent 55%);}
#lobby{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.6rem;text-align:center;overflow-y:auto;}
.flame{font-size:3rem;margin-bottom:.5rem;filter:drop-shadow(0 0 20px rgba(201,168,76,.6));animation:flicker 3s ease-in-out infinite;}
@keyframes flicker{0%,100%{opacity:1;transform:scale(1)}45%{opacity:.85;transform:scale(.97)}70%{opacity:.95;transform:scale(1.02)}}
.lobby-title{font-family:'Cinzel',serif;font-weight:700;font-size:1.9rem;color:var(--gold);letter-spacing:.04em;text-shadow:0 0 30px rgba(201,168,76,.4);line-height:1.2;}
.lobby-sub{font-style:italic;color:var(--gold-dim);font-size:.95rem;margin-top:.5rem;letter-spacing:.08em;}
.lobby-ref{color:var(--parchment);font-size:.85rem;margin-top:.3rem;opacity:.7;}
.divider-line{width:60%;max-width:240px;height:1px;margin:1.6rem 0;background:linear-gradient(to right,transparent,var(--gold),transparent);}
.role-grid{display:flex;flex-direction:column;gap:.9rem;width:100%;max-width:320px;}
.role-btn{font-family:'Cinzel',serif;font-weight:600;font-size:.85rem;letter-spacing:.06em;padding:1.05rem 1rem;border-radius:12px;cursor:pointer;background:var(--panel2);border:1px solid var(--border);color:var(--cream);transition:transform .12s,border-color .2s,background .2s;}
.role-btn:active{transform:scale(.97);}
.role-btn small{display:block;font-family:'Crimson Pro',serif;font-weight:400;font-size:.78rem;letter-spacing:0;color:var(--parchment);opacity:.7;margin-top:.25rem;text-transform:none;}
.role-btn.primary{background:linear-gradient(135deg,#2e2109,#221a09);border-color:var(--gold);color:var(--gold-light);padding:1.25rem 1rem;font-size:.95rem;}
.role-teacher-link{margin-top:1.3rem;color:var(--gold-dim);font-size:.8rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;letter-spacing:.04em;font-family:'Cinzel',serif;}
.join-panel{width:100%;max-width:320px;margin-top:1rem;display:none;}
.join-panel.show{display:block;animation:fadeUp .3s ease;}
.field-label{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.12em;color:var(--gold-dim);text-transform:uppercase;margin-bottom:.5rem;}
.code-input{width:100%;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:2rem;letter-spacing:.5em;text-indent:.5em;padding:.9rem;border-radius:12px;background:var(--ink);border:1px solid var(--gold-dim);color:var(--gold-light);outline:none;margin-bottom:.8rem;}
.code-input::placeholder{color:#5a4a20;letter-spacing:.3em;}
.join-go{width:100%;font-family:'Cinzel',serif;font-weight:600;font-size:.85rem;letter-spacing:.06em;padding:.95rem;border-radius:12px;cursor:pointer;background:var(--gold);color:var(--ink);border:none;transition:transform .12s;}
.join-go:active{transform:scale(.97);}
.join-msg{color:var(--red);font-size:.82rem;margin-top:.6rem;min-height:1rem;font-style:italic;line-height:1.5;}
.back-link{color:var(--gold-dim);font-size:.82rem;margin-top:1.2rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
#stage{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;}
#stage.show{display:flex;}
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;padding-top:calc(.7rem + env(safe-area-inset-top));border-bottom:1px solid var(--border);background:rgba(13,10,4,.85);backdrop-filter:blur(8px);position:relative;z-index:5;gap:.5rem;}
.topbar .brand{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.1em;color:var(--gold);display:flex;align-items:center;gap:.4rem;flex:0 0 auto;}
.topbar .brand .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:flicker 3s infinite;}
.topbar .meta{display:flex;align-items:center;gap:.6rem;font-size:.7rem;color:var(--gold-dim);flex:0 0 auto;}
.badge-role{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.08em;padding:.2rem .5rem;border-radius:20px;border:1px solid var(--border);color:var(--parchment);}
.badge-role.teacher{border-color:var(--gold);color:var(--gold-light);}
.font-ctl{display:flex;align-items:center;gap:.3rem;}
.font-btn{width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--border);color:var(--gold);font-family:'Cinzel',serif;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:transform .1s,background .2s;}
.font-btn:active{transform:scale(.9);background:var(--panel);}
.font-btn.minus{font-size:.8rem;}.font-btn.plus{font-size:1rem;}
.viewport{flex:1 1 auto;position:relative;overflow:hidden;font-size:16px;}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:1.6rem 1.4rem 6rem;opacity:0;pointer-events:none;transform:translateX(20px);transition:opacity .35s ease,transform .35s ease;-webkit-overflow-scrolling:touch;}
.slide.active{opacity:1;pointer-events:auto;transform:translateX(0);}
.slide::-webkit-scrollbar{width:0;}
.kicker{font-family:'Cinzel',serif;font-size:.75em;letter-spacing:.06em;color:var(--gold-dim);margin-bottom:.7rem;}
.slide h1{font-family:'Cinzel',serif;font-weight:700;font-size:1.7em;color:var(--gold);line-height:1.25;margin-bottom:1rem;text-shadow:0 0 24px rgba(201,168,76,.3);}
.slide h2{font-family:'Cinzel',serif;font-weight:600;font-size:1.15em;color:var(--gold-light);margin:1.3rem 0 .6rem;}
.points{list-style:none;margin:.4rem 0;}
.points li{position:relative;padding:.55rem 0 .55rem 1.5rem;font-size:1.18em;line-height:1.45;color:var(--cream);border-bottom:1px solid rgba(70,55,19,.4);}
.points li:last-child{border-bottom:none;}
.points li::before{content:'';position:absolute;left:0;top:1.05em;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(201,168,76,.5);}
.points li b{color:var(--gold-light);}
.verse{border-left:3px solid var(--gold);background:var(--panel);border-radius:0 8px 8px 0;padding:.85rem 1rem;margin:1rem 0;}
.verse .ref{font-family:'Cinzel',serif;font-size:.78em;letter-spacing:.06em;color:var(--gold);margin-bottom:.35rem;}
.verse .txt{font-style:italic;font-size:1.05em;line-height:1.55;color:var(--parchment);}
.note-line{font-size:1em;color:var(--parchment);opacity:.75;font-style:italic;text-align:center;margin-top:1rem;}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;padding-bottom:6rem;}
.cover .flame{font-size:2.6rem;}
.cover h1{font-size:2.2em;margin:.6rem 0 .4rem;}
.cover .c-ref{font-style:italic;color:var(--gold-dim);letter-spacing:.1em;font-size:1em;}
.cover .c-series{color:var(--parchment);opacity:.6;font-size:.85em;margin-top:.4rem;font-style:italic;}
.session-chip{margin-top:1.8rem;padding:.7rem 1.3rem;border:1px solid var(--border);border-radius:12px;background:var(--panel);}
.session-chip .lbl{font-family:'Cinzel',serif;font-size:.68em;letter-spacing:.05em;color:var(--gold-dim);}
.session-chip .code{font-family:'Cinzel',serif;font-weight:700;font-size:2.2em;letter-spacing:.4em;text-indent:.4em;color:var(--gold-light);text-shadow:0 0 20px rgba(201,168,76,.4);}
.timeline{position:relative;margin:1.4rem 0 .5rem;padding-left:1.2rem;}
.timeline::before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:linear-gradient(to bottom,var(--gold-dim),rgba(201,168,76,.2));}
.tl-item{position:relative;padding:0 0 1.4rem 1.2rem;}
.tl-item::before{content:'';position:absolute;left:-1.15rem;top:5px;width:11px;height:11px;border-radius:50%;background:var(--panel2);border:2px solid var(--gold-dim);}
.tl-item.key::before{background:var(--gold);border-color:var(--gold-light);box-shadow:0 0 12px rgba(201,168,76,.7);}
.tl-year{font-family:'Cinzel',serif;font-weight:600;font-size:1.05em;color:var(--gold);}
.tl-label{font-size:1.08em;color:var(--cream);margin-top:.15rem;}
.tl-sub{font-size:.9em;color:var(--parchment);opacity:.6;font-style:italic;margin-top:.1rem;}
.chain{display:flex;flex-direction:column;gap:.6rem;margin:1.2rem 0;}
.chain-step{display:flex;align-items:center;gap:.8rem;padding:.9rem 1rem;border-radius:10px;background:var(--panel);border:1px solid var(--border);opacity:.35;transform:translateX(-8px);transition:opacity .4s ease,transform .4s ease,border-color .4s ease,background .4s ease;}
.chain-step.lit{opacity:1;transform:translateX(0);border-color:var(--gold-dim);background:var(--panel2);}
.chain-step .num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:.9em;font-weight:600;background:var(--ink);color:var(--gold);border:1px solid var(--gold-dim);}
.chain-step .body{flex:1;}
.chain-step .word{font-family:'Cinzel',serif;font-size:1.1em;color:var(--cream);}
.chain-step .heb{font-size:.86em;color:var(--gold-dim);font-style:italic;margin-top:.15rem;}
.chain-step.danger .word{color:var(--red);}.chain-step.danger .num{border-color:var(--red);color:var(--red);}
.chain-arrow{text-align:center;color:var(--gold-dim);font-size:.9rem;opacity:.5;margin:-.3rem 0;}
.tap-hint{text-align:center;font-size:.85em;color:var(--gold-dim);font-style:italic;margin-top:.7rem;opacity:.7;}
.gen-strip{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:1.3rem 0;}
.gen-node{font-family:'Cinzel',serif;font-size:.85em;padding:.4rem .6rem;border-radius:8px;background:var(--panel);border:1px solid var(--border);color:var(--parchment);}
.gen-node.mark{background:linear-gradient(135deg,#2e2109,#221a09);border-color:var(--gold);color:var(--gold-light);font-weight:600;}
.gen-node.q{border-style:dashed;color:var(--gold-dim);}
.gen-sep{color:var(--gold-dim);font-size:.9em;}
.phase{margin:1.1rem 0;}
.phase-head{font-family:'Cinzel',serif;font-size:.85em;letter-spacing:.06em;color:var(--gold);margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.phase-head .pnum{background:var(--gold);color:var(--ink);border-radius:6px;padding:.1rem .45rem;font-weight:700;font-size:.85em;}
.phase-head .pyears{color:var(--gold-dim);font-weight:400;font-size:.85em;font-style:italic;}
.place-row{display:flex;flex-wrap:wrap;gap:.45rem;}
.place-chip{padding:.45rem .75rem;border-radius:20px;font-size:.92em;background:var(--panel);border:1px solid var(--border);color:var(--cream);cursor:pointer;transition:transform .12s,border-color .2s,background .2s;}
.place-chip:active{transform:scale(.94);}
.place-chip.open{border-color:var(--gold);background:var(--panel2);color:var(--gold-light);}
.place-detail{margin-top:.5rem;padding:.75rem .9rem;border-radius:8px;background:var(--panel);border-left:3px solid var(--gold);font-size:1em;color:var(--parchment);display:none;}
.place-detail.show{display:block;animation:fadeUp .25s ease;}
.place-detail .pmean{color:var(--gold);font-style:italic;}
.par-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:.7rem;background:var(--panel);}
.par-head{display:flex;cursor:pointer;}
.par-head > div{flex:1;padding:.8rem .9rem;}
.par-head .d{border-right:1px solid var(--border);}
.par-lbl{font-family:'Cinzel',serif;font-size:.68em;letter-spacing:.08em;color:var(--gold-dim);text-transform:uppercase;margin-bottom:.2rem;}
.par-ref{font-size:1em;color:var(--cream);}
.par-body{display:none;padding:.4rem .9rem 1rem;border-top:1px solid var(--border);background:var(--ink);}
.par-body.show{display:block;animation:fadeUp .25s ease;}
.par-body .pv{margin-top:.7rem;}
.par-body .pv .pvl{font-family:'Cinzel',serif;font-size:.68em;letter-spacing:.06em;color:var(--gold);margin-bottom:.2rem;}
.par-body .pv .pvt{font-style:italic;font-size:1em;line-height:1.5;color:var(--parchment);}
.par-caret{text-align:center;font-size:.82em;color:var(--gold-dim);padding:.25rem 0 .55rem;opacity:.6;}
.lesson-num{display:inline-block;font-family:'Cinzel',serif;font-size:.75em;letter-spacing:.1em;color:var(--ink);background:var(--gold);padding:.28rem .7rem;border-radius:20px;margin-bottom:.9rem;}
.callout{border:1px solid var(--gold-dim);border-radius:10px;padding:1.1rem;margin:1.2rem 0;background:linear-gradient(135deg,rgba(46,33,9,.6),rgba(25,19,7,.6));text-align:center;}
.callout .big{font-family:'Cinzel',serif;color:var(--gold-light);font-size:1.1em;margin-bottom:.5rem;}
.callout .small{font-size:1.05em;color:var(--parchment);line-height:1.55;}
/* ─── QUIZ ─── */
.quiz-tag{display:inline-block;font-family:'Cinzel',serif;font-size:.78em;letter-spacing:.04em;color:var(--gold-light);background:transparent;border:1px solid var(--gold-dim);padding:.3rem .85rem;border-radius:20px;margin-bottom:1rem;}
.quiz-q{font-size:1.3em;line-height:1.4;color:var(--cream);margin-bottom:1.2rem;font-weight:500;}
.quiz-opts{display:flex;flex-direction:column;gap:.7rem;}
.quiz-opt{display:flex;align-items:flex-start;gap:.7rem;padding:.9rem 1rem;border-radius:12px;background:var(--panel);border:1.5px solid var(--border);color:var(--cream);cursor:pointer;font-size:1.1em;line-height:1.4;transition:transform .1s,border-color .2s,background .2s;}
.quiz-opt:active{transform:scale(.98);}
.quiz-opt .opt-letter{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:.85em;font-weight:600;background:var(--ink);color:var(--gold);border:1px solid var(--gold-dim);}
.quiz-opt.sel{border-color:var(--gold);background:var(--panel2);}
.quiz-opt.sel .opt-letter{background:var(--gold);color:var(--ink);}
.quiz-opt.correct{border-color:var(--green);background:rgba(92,138,58,.18);}
.quiz-opt.correct .opt-letter{background:var(--green);color:#fff;border-color:var(--green-light);}
.quiz-opt.wrong{border-color:var(--red);background:rgba(161,58,42,.15);}
.quiz-opt.wrong .opt-letter{background:var(--red);color:#fff;border-color:var(--red);}
.quiz-opt .opt-mark{margin-left:auto;font-size:1.1em;opacity:0;flex:0 0 auto;}
.quiz-opt.correct .opt-mark{opacity:1;color:var(--green-light);}
.quiz-opt.wrong .opt-mark{opacity:1;color:var(--red);}
.quiz-opts.revealed .quiz-opt{cursor:default;pointer-events:none;}
.quiz-explain{display:none;margin-top:1.1rem;padding:.9rem 1rem;border-radius:10px;background:var(--panel);border-left:3px solid var(--green);font-size:1.02em;line-height:1.5;color:var(--parchment);}
.quiz-explain.show{display:block;animation:fadeUp .3s ease;}
.quiz-explain b{color:var(--green-light);}
.reveal-btn{display:none;width:100%;margin-top:1.3rem;font-family:'Cinzel',serif;font-size:.85em;letter-spacing:.06em;padding:1rem;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#2e2109,#221a09);border:1px solid var(--gold);color:var(--gold-light);transition:transform .12s;}
.reveal-btn:active{transform:scale(.98);}
.reveal-btn.done{background:var(--panel);border-color:var(--border);color:var(--gold-dim);pointer-events:none;}
body.is-teacher .reveal-btn{display:block;}
.wait-hint{display:none;text-align:center;font-size:.9em;color:var(--gold-dim);font-style:italic;margin-top:1.2rem;}
body.is-follower .wait-hint{display:block;}
body.is-follower .wait-hint.hidden{display:none;}
/* score */
.score-ring{width:150px;height:150px;margin:1.5rem auto;border-radius:50%;border:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(46,33,9,.6),transparent);box-shadow:0 0 30px rgba(201,168,76,.3);}
.score-ring .sv{font-family:'Cinzel',serif;font-weight:700;font-size:2.6em;color:var(--gold-light);line-height:1;}
.score-ring .sl{font-size:.85em;color:var(--gold-dim);letter-spacing:.1em;margin-top:.3rem;}
.controlbar{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;padding-bottom:calc(.7rem + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:rgba(13,10,4,.9);backdrop-filter:blur(10px);position:relative;z-index:5;}
.nav-btn{flex:0 0 auto;width:52px;height:52px;border-radius:14px;background:var(--panel2);border:1px solid var(--border);color:var(--gold);font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,background .2s,opacity .2s;}
.nav-btn:active{transform:scale(.92);}
.nav-btn:disabled{opacity:.25;}
.nav-btn.next{background:linear-gradient(135deg,#2e2109,#221a09);border-color:var(--gold);}
.progress-wrap{flex:1;display:flex;flex-direction:column;gap:.35rem;}
.dots{display:flex;gap:.2rem;justify-content:center;flex-wrap:wrap;}
.dot-p{width:6px;height:6px;border-radius:50%;background:var(--border);transition:all .3s;}
.dot-p.on{background:var(--gold);box-shadow:0 0 8px var(--gold);width:16px;border-radius:4px;}
.dot-p.quiz{border:1px solid var(--gold-dim);background:transparent;}
.dot-p.quiz.on{background:var(--gold);}
.pos-text{text-align:center;font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.08em;color:var(--gold-dim);}
.follower-note{flex:1;text-align:center;font-style:italic;font-size:.9rem;color:var(--gold-dim);display:flex;align-items:center;justify-content:center;gap:.5rem;}
.follower-note .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.unlock-btn{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.05em;padding:.55rem .85rem;border-radius:10px;cursor:pointer;background:var(--panel2);border:1px solid var(--border);color:var(--parchment);}
.follow-back{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.05em;padding:.65rem 1rem;border-radius:10px;cursor:pointer;background:var(--gold);color:var(--ink);border:none;flex:0 0 auto;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold-dim);color:var(--gold-light);font-size:.85rem;padding:.6rem 1rem;border-radius:20px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

.conn-pill{display:inline-flex;align-items:center;gap:.35rem;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.06em;padding:.22rem .55rem;border-radius:20px;border:1px solid var(--border);color:var(--gold-dim);white-space:nowrap;}
.conn-pill .cdot{width:6px;height:6px;border-radius:50%;background:var(--gold-dim);}
.conn-pill.online{border-color:var(--green);color:var(--green-light);}
.conn-pill.online .cdot{background:var(--green);box-shadow:0 0 6px var(--green);}
.conn-pill.offline{border-color:var(--red);color:var(--red);}
.conn-pill.offline .cdot{background:var(--red);}


/* eyebrow — used once, on cover only */
.eyebrow{font-family:'Cinzel',serif;font-size:.8em;letter-spacing:.05em;color:var(--gold-dim);margin-bottom:.4rem;}

/* lead sentence under a heading */
.lead{font-size:1.15em;line-height:1.5;color:var(--parchment);margin-bottom:1.1rem;}
.lead.center{text-align:center;opacity:.85;}

/* place identity block */
.place-num{font-family:'Cinzel',serif;font-size:.8em;letter-spacing:.04em;color:var(--gold-dim);margin-bottom:.25rem;}
.place-mean{font-style:italic;font-size:.98em;color:var(--gold-dim);margin:-.7rem 0 1.1rem;}

/* phase list */
.phase-now{font-size:.98em;color:var(--parchment);opacity:.8;margin-top:.15rem;padding-left:2rem;}
.phase.dim{opacity:.4;}

/* two-sided contrast (kayu hidup/kering, dua lidah) */
.contrast-wrap{display:flex;align-items:stretch;margin:2rem 0;gap:0;}
.contrast-side{flex:1;text-align:center;padding:1.4rem .7rem;}
.contrast-div{width:1px;background:linear-gradient(to bottom,transparent,var(--gold-dim),transparent);flex:0 0 1px;}
.cs-label{font-family:'Cinzel',serif;font-size:.8em;color:var(--gold-dim);letter-spacing:.04em;margin-bottom:.5rem;}
.cs-word{font-family:'Cinzel',serif;font-size:1.35em;color:var(--gold-light);line-height:1.25;margin-bottom:.5rem;}
.cs-note{font-size:.95em;color:var(--parchment);opacity:.75;font-style:italic;line-height:1.4;}

/* ledger list (tempat -> siapa) */
.points.ledger li{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding-left:0;}
.points.ledger li::before{display:none;}
.lg-place{font-family:'Cinzel',serif;font-size:1.02em;color:var(--cream);flex:0 0 auto;}
.lg-who{font-size:1em;color:var(--gold-light);text-align:right;position:relative;}
.lg-who.fade{color:var(--parchment);opacity:.6;font-style:italic;}
.points.ledger li{position:relative;}
.points.ledger li::after{content:'';position:absolute;left:0;right:0;bottom:.75em;border-bottom:1px dotted rgba(138,111,48,.35);z-index:-1;}

/* psalm numbers row */
.psalm-row{display:flex;justify-content:center;gap:.9rem;margin:1.6rem 0 1.2rem;flex-wrap:wrap;}
.psalm-row .pm{font-family:'Cinzel',serif;font-size:1.5em;color:var(--gold);width:2.2em;height:2.2em;display:flex;align-items:center;justify-content:center;border:1px solid var(--gold-dim);border-radius:50%;}

let role=null,sessionCode=null,current=0,following=true,pollTimer=null;
let fontIdx=1;const FONT_STEPS=[14,16,18,20,23];
let reveals={};            // slideIndex -> true (synced)
let mySelections={};       // slideIndex -> optIndex (local, per peserta)
const KEY=c=>`pelita:session:${c}`;
const isQuiz=i=>!!SLIDES[i].quiz;
const totalQuiz=SLIDES.filter(s=>s.quiz).length;

function showJoin(){document.getElementById('roleGrid').style.display='none';document.getElementById('teacherPanel').classList.remove('show');document.getElementById('joinPanel').classList.add('show');setTimeout(()=>document.getElementById('codeInput').focus(),100);}
function hideJoin(){document.getElementById('joinPanel').classList.remove('show');document.getElementById('roleGrid').style.display='flex';document.getElementById('joinMsg').textContent='';}
function showTeacher(){document.getElementById('roleGrid').style.display='none';document.getElementById('joinPanel').classList.remove('show');document.getElementById('teacherPanel').classList.add('show');setTimeout(()=>document.getElementById('pinInput').focus(),100);}
function hideTeacher(){document.getElementById('teacherPanel').classList.remove('show');document.getElementById('roleGrid').style.display='flex';document.getElementById('pinMsg').textContent='';}

async function startTeacher(){const pin=document.getElementById('pinInput').value.trim();const msg=document.getElementById('pinMsg');if(pin!==TEACHER_PIN){msg.textContent='PIN salah.';document.getElementById('pinInput').value='';return;}if(!fbReady){msg.textContent='Firebase belum dikonfigurasi (lihat komentar di file).';return;}role='teacher';document.body.classList.add('is-teacher');sessionCode=String(Math.floor(1000+Math.random()*9000));fbRef=fbDB.ref('pelita9/'+sessionCode);try{await fbRef.set({slide:0,reveals:{},ts:Date.now()});}catch(e){msg.innerHTML='<b>Gagal membuat sesi.</b><br><span style="font-size:.9em;color:#d8c9a4">'+(e&&e.message?e.message:e)+'</span><br><span style="font-size:.85em;color:#8a6f30">Cek: Realtime Database sudah dibuat? Rules sudah dibuka?</span>';return;}enterStage();}
async function joinSession(){const code=document.getElementById('codeInput').value.trim();const msg=document.getElementById('joinMsg');if(code.length!==4){msg.textContent='Masukkan 4 angka.';return;}if(!fbReady){msg.textContent='Firebase belum dikonfigurasi (lihat komentar di file).';return;}msg.textContent='Menghubungkan...';try{fbRef=fbDB.ref('pelita9/'+code);const snap=await fbRef.get();if(!snap.exists()){msg.textContent='Sesi tidak ditemukan. Cek kode.';return;}const data=snap.val();role='follower';document.body.classList.add('is-follower');sessionCode=code;current=data.slide||0;reveals=data.reveals||{};following=true;enterStage();startListening();}catch(e){msg.innerHTML='<b>Gagal terhubung.</b><br><span style="font-size:.9em;color:#d8c9a4">'+(e&&e.message?e.message:e)+'</span>';}}

function enterStage(){watchConnection();document.getElementById('lobby').style.display='none';document.getElementById('stage').classList.add('show');buildSlides();buildControlBar();applyFont();document.getElementById('roleBadge').textContent=role==='teacher'?'PENGAJAR':'PESERTA';document.getElementById('roleBadge').className='badge-role '+(role==='teacher'?'teacher':'');if(role==='teacher')document.getElementById('coverSession')?.style.setProperty('display','block');renderSession();goTo(current);}

function buildSlides(){const vp=document.getElementById('viewport');vp.innerHTML='';SLIDES.forEach((s,i)=>{const d=document.createElement('div');d.className='slide';d.dataset.idx=i;d.innerHTML=s.quiz?renderQuiz(s.quiz,i):s.html;vp.appendChild(d);});wireInteractions();}

function renderQuiz(q,idx){
  const letters=['A','B','C','D','E'];
  let opts=q.opts.map((o,k)=>`<div class="quiz-opt" data-qz="${idx}" data-opt="${k}"><span class="opt-letter">${letters[k]}</span><span class="opt-text">${o}</span><span class="opt-mark"></span></div>`).join('');
  return `<div class="quiz-tag">${q.tag||'Kuis'}</div><div class="quiz-q">${q.q}</div><div class="quiz-opts" data-opts="${idx}">${opts}</div><button class="reveal-btn" data-reveal="${idx}" onclick="revealAnswer(${idx})">Buka Jawaban</button><div class="wait-hint" data-wait="${idx}">Pilih jawaban Anda — tunggu pengajar membuka.</div><div class="quiz-explain" data-explain="${idx}">${q.explain}</div>`;
}

function renderSession(){if(sessionCode){const cc=document.getElementById('coverCode');if(cc)cc.textContent=sessionCode;if(role==='teacher')document.getElementById('statusMeta').innerHTML=`<span style="color:var(--gold-light);font-family:'Cinzel';letter-spacing:.1em">${sessionCode}</span>`;}}
function fontStep(dir){fontIdx=Math.max(0,Math.min(FONT_STEPS.length-1,fontIdx+dir));applyFont();toast('Ukuran teks: '+(fontIdx+1)+'/'+FONT_STEPS.length);}
function applyFont(){document.getElementById('viewport').style.fontSize=FONT_STEPS[fontIdx]+'px';}

function buildControlBar(){const cb=document.getElementById('controlbar');if(role==='teacher'){cb.innerHTML=`<button class="nav-btn prev" id="btnPrev" onclick="prev()">‹</button><div class="progress-wrap"><div class="dots" id="dots"></div><div class="pos-text" id="posText"></div></div><button class="nav-btn next" id="btnNext" onclick="next()">›</button>`;buildDots();}else{cb.innerHTML=`<div class="follower-note" id="followNote"><span class="sync-dot"></span> Mengikuti pengajar</div><button class="unlock-btn" id="unlockBtn" onclick="toggleFollow()">Lihat bebas</button>`;}}
function buildDots(){const dots=document.getElementById('dots');if(!dots)return;dots.innerHTML='';SLIDES.forEach((s,i)=>{const dp=document.createElement('div');dp.className='dot-p'+(i===current?' on':'')+(s.quiz?' quiz':'');dots.appendChild(dp);});}
function updateControls(){if(role==='teacher'){document.querySelectorAll('.dot-p').forEach((d,i)=>d.classList.toggle('on',i===current));const pt=document.getElementById('posText');if(pt)pt.textContent=`${current+1} / ${SLIDES.length}`;const bp=document.getElementById('btnPrev'),bn=document.getElementById('btnNext');if(bp)bp.disabled=current===0;if(bn)bn.disabled=current===SLIDES.length-1;}}

function goTo(idx){idx=Math.max(0,Math.min(SLIDES.length-1,idx));current=idx;document.querySelectorAll('.slide').forEach((s,i)=>{s.classList.toggle('active',i===idx);if(i===idx)s.scrollTop=0;});updateControls();if(SLIDES[idx].id==='score')computeScore();if(isQuiz(idx)&&reveals[idx])applyReveal(idx);if(role==='teacher')pushState();}
function next(){if(current<SLIDES.length-1)goTo(current+1);}
function prev(){if(current>0)goTo(current-1);}

async function pushState(){if(role!=='teacher'||!fbRef)return;try{await fbRef.set({slide:current,reveals:reveals,ts:Date.now()});}catch(e){}}
function startListening(){if(!fbRef)return;fbRef.on('value',snap=>{const data=snap.val();if(!data)return;
  if(data.reveals){Object.keys(data.reveals).forEach(k=>{if(!reveals[k]){reveals[k]=true;if(parseInt(k)===current)applyReveal(parseInt(k));}});}
  if(following&&data.slide!==current){goTo(data.slide);flashSync();}
  window._latestTeacherSlide=data.slide;});}
function flashSync(){const n=document.getElementById('followNote');if(n){n.style.color='var(--gold-light)';setTimeout(()=>n.style.color='',600);}}
function toggleFollow(){following=!following;const note=document.getElementById('followNote'),btn=document.getElementById('unlockBtn');if(following){if(typeof window._latestTeacherSlide==='number')goTo(window._latestTeacherSlide);note.innerHTML='<span class="sync-dot"></span> Mengikuti pengajar';btn.textContent='Lihat bebas';btn.className='unlock-btn';toast('Kembali mengikuti pengajar');}else{note.innerHTML='<span style="color:var(--gold-dim)">Mode bebas — geser sendiri</span>';btn.textContent='↺ Ikuti lagi';btn.className='follow-back';toast('Anda bisa menggeser sendiri');}}

/* quiz reveal */
function revealAnswer(idx){if(role!=='teacher')return;reveals[idx]=true;applyReveal(idx);pushState();}
function applyReveal(idx){
  const q=SLIDES[idx].quiz;if(!q)return;
  const optsWrap=document.querySelector(`.quiz-opts[data-opts="${idx}"]`);if(!optsWrap)return;
  if(optsWrap.classList.contains('revealed'))return;
  optsWrap.classList.add('revealed');
  const opts=optsWrap.querySelectorAll('.quiz-opt');
  const sel=mySelections[idx];
  opts.forEach((o,k)=>{
    if(k===q.correct){o.classList.add('correct');o.querySelector('.opt-mark').textContent='✓';}
    else if(sel===k){o.classList.add('wrong');o.querySelector('.opt-mark').textContent='✗';}
  });
  const ex=document.querySelector(`.quiz-explain[data-explain="${idx}"]`);if(ex)ex.classList.add('show');
  const rb=document.querySelector(`.reveal-btn[data-reveal="${idx}"]`);if(rb){rb.textContent='Jawaban terbuka ✓';rb.classList.add('done');}
  const wh=document.querySelector(`.wait-hint[data-wait="${idx}"]`);if(wh)wh.classList.add('hidden');
}

function computeScore(){
  let correct=0,answered=0;
  SLIDES.forEach((s,i)=>{if(s.quiz){if(mySelections[i]!==undefined){answered++;if(mySelections[i]===s.quiz.correct)correct++;}}});
  const sv=document.getElementById('scoreVal'),sl=document.getElementById('scoreLbl'),sm=document.getElementById('scoreMsg');
  if(sv)sv.textContent=correct;
  if(sl)sl.textContent=`dari ${totalQuiz} kuis`;
  if(sm){
    if(role==='teacher'){sm.innerHTML='Skor dihitung di HP masing-masing peserta.';}
    else if(answered===0){sm.innerHTML='Anda belum menjawab kuis apa pun.';}
    else{let m=correct===totalQuiz?'Sempurna! 🔥':correct>=totalQuiz*0.6?'Bagus sekali!':'Teruslah merenungkan firman.';sm.innerHTML=`${m}<br><span style="font-size:.85em;opacity:.7">${answered} dari ${totalQuiz} kuis Anda jawab</span>`;}
  }
}

function wireInteractions(){
  const chain=document.getElementById('chain');if(chain){chain.querySelectorAll('.chain-step').forEach(step=>{step.addEventListener('click',()=>{step.classList.add('lit');const hint=document.getElementById('chainHint');if([...chain.querySelectorAll('.chain-step')].every(s=>s.classList.contains('lit'))){if(hint)hint.style.display='none';}});});}
  document.querySelectorAll('.place-row').forEach(row=>{const phase=row.dataset.phase;const detail=document.querySelector(`.place-detail[data-detail="${phase}"]`);row.querySelectorAll('.place-chip').forEach(chip=>{chip.addEventListener('click',()=>{const wasOpen=chip.classList.contains('open');row.querySelectorAll('.place-chip').forEach(c=>c.classList.remove('open'));if(wasOpen){detail.classList.remove('show');return;}chip.classList.add('open');detail.innerHTML=`<span class="pmean">${chip.textContent}</span> — ${chip.dataset.mean}`;detail.classList.add('show');});});});
  document.querySelectorAll('.par-head').forEach(head=>{const i=head.dataset.par;const body=document.querySelector(`.par-body[data-body="${i}"]`);const caret=document.querySelector(`.par-caret[data-caret="${i}"]`);head.addEventListener('click',()=>{const open=body.classList.toggle('show');if(caret)caret.textContent=open?'▴ tutup':'▾ buka';});});
  document.querySelectorAll('.quiz-opt').forEach(opt=>{opt.addEventListener('click',()=>{const idx=parseInt(opt.dataset.qz);if(reveals[idx])return;const k=parseInt(opt.dataset.opt);mySelections[idx]=k;document.querySelectorAll(`.quiz-opt[data-qz="${idx}"]`).forEach(o=>o.classList.remove('sel'));opt.classList.add('sel');});});
}

let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}
document.addEventListener('keydown',e=>{if(role==='teacher'||(role==='follower'&&!following)){if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();}});
let touchX=null;
document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(role==='follower'&&following)return;if(Math.abs(dx)<60)return;if(dx<0)next();else prev();},{passive:true});
document.getElementById('codeInput').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);});
document.getElementById('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')joinSession();});
document.getElementById('pinInput').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);});


/* ── Tes koneksi database (diagnosa) ── */
async function testDB(){
  const msg=document.getElementById('pinMsg');
  msg.style.color='#d8c9a4';
  if(!fbReady){msg.innerHTML='<b>Firebase belum siap.</b><br>Config belum terisi atau SDK gagal dimuat.';return;}
  msg.innerHTML='Menguji...';
  try{
    const t=fbDB.ref('pelita9/_test');
    await t.set({ok:true,ts:Date.now()});
    const s=await t.get();
    await t.remove();
    if(s.exists()){msg.innerHTML='<b style="color:#8fc46a">Berhasil.</b><br><span style="color:#d8c9a4">Database aktif dan bisa ditulis. Silakan Mulai Sesi.</span>';}
    else{msg.innerHTML='<b>Tulis berhasil tapi baca kosong.</b><br>Cek aturan .read pada Rules.';}
  }catch(e){
    msg.style.color='#a13a2a';
    msg.innerHTML='<b>Gagal.</b><br><span style="font-size:.9em;color:#d8c9a4">'+(e&&e.message?e.message:e)+'</span><br><span style="font-size:.85em;color:#8a6f30">Kemungkinan: database belum dibuat, atau Rules masih terkunci.</span>';
  }
}

/* ── Monitor koneksi Firebase (lintas jaringan) ── */
function setConn(state,label){
  const p=document.getElementById('connPill'),t=document.getElementById('connTxt');
  if(!p||!t)return;
  p.className='conn-pill'+(state?' '+state:'');
  t.textContent=label;
}
function watchConnection(){
  if(!fbReady||!fbDB){setConn('offline','OFFLINE');return;}
  try{
    fbDB.ref('.info/connected').on('value',s=>{
      if(s.val()===true) setConn('online','TERHUBUNG');
      else setConn('offline','MENGHUBUNGKAN');
    });
  }catch(e){setConn('offline','OFFLINE');}
}

document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')startTeacher();});
</script>

<!--
════════════════════════════════════════════════════════════════════
  PANDUAN SETUP FIREBASE (sekali saja, ±5 menit)
════════════════════════════════════════════════════════════════════

  1. Buka https://console.firebase.google.com → "Add project"
     (beri nama bebas, mis. "pelita"). Matikan Google Analytics
     kalau ditanya (tidak perlu). Klik Create.

  2. Di menu kiri: Build → Realtime Database → "Create Database".
     - Pilih lokasi (mis. Singapore / asia-southeast1).
     - Saat ditanya rules, pilih "Start in TEST MODE" lalu Enable.
       (Test mode cukup untuk kelompok kecil. Lihat catatan keamanan
        di bawah bila ingin lebih aman.)

  3. Di menu kiri klik ikon gerigi (Project settings) → scroll ke
     "Your apps" → klik ikon "</>" (Web) untuk daftarkan web app.
     Beri nama bebas, klik Register app.

  4. Firebase akan menampilkan sebuah objek "firebaseConfig = {...}".
     SALIN nilai-nilainya, lalu TEMPEL ke FIREBASE_CONFIG di bagian
     atas file ini (apiKey, authDomain, databaseURL, dst).
     PENTING: pastikan "databaseURL" ada (kalau tidak muncul, ambil
     dari halaman Realtime Database — bentuknya:
     https://NAMA-default-rtdb.firebaseio.com atau ...asia-southeast1...)

  5. Simpan file, upload ke GitHub, bagikan link via WA. Selesai.
     Pengajar → "Saya pengajar" → PIN → dapat kode. Murid → "Gabung"
     → masukkan kode. Sinkron sekarang berjalan realtime lintas HP.

  ── Catatan keamanan (opsional) ─────────────────────────────────────
  Test mode terbuka untuk siapa saja selama ±30 hari lalu menutup.
  Untuk pemakaian rutin, ganti Rules (Realtime Database → Rules)
  menjadi hanya izinkan cabang "pelita":

      {
        "rules": {
          "pelita": { ".read": true, ".write": true }
        }
      }

  Ini tetap terbuka (tanpa login) tapi terbatas pada data presentasi
  ini — aman untuk kelompok kecil karena tidak ada data pribadi.
════════════════════════════════════════════════════════════════════
-->
