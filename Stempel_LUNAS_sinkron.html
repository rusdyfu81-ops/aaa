<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
<title>Stempel LUNAS · sinkron</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Asap:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<style>
  :root{
    --kertas:#EDEFF1;
    --kartu:#FCFCFA;
    --kartu-2:#F3F4F1;
    --tinta:#151B2E;
    --tinta-2:#5C6879;
    --garis:#D2D7DD;
    --garis-kuat:#B6BEC8;
    --stempel:#BE2A25;
    --lunas:#1A7052;
    --emas:#9A6B10;
    --emas-bg:#F6EBCF;
    --lunas-bg:#E2F0EA;
    --stempel-bg:#F8E5E3;
    --radius:10px;
    --shadow:0 1px 0 var(--garis), 0 6px 18px -12px rgba(21,27,46,.35);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --kertas:#0D1220;
      --kartu:#171E30;
      --kartu-2:#1E263A;
      --tinta:#E8EBF1;
      --tinta-2:#95A0B5;
      --garis:#2A3349;
      --garis-kuat:#3C476180;
      --stempel:#EC5C55;
      --lunas:#43AE86;
      --emas:#DCAE49;
      --emas-bg:#2E2718;
      --lunas-bg:#16302A;
      --stempel-bg:#331A1A;
      --shadow:0 1px 0 var(--garis), 0 8px 22px -14px #000;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --kertas:#0D1220;
    --kartu:#171E30;
    --kartu-2:#1E263A;
    --tinta:#E8EBF1;
    --tinta-2:#95A0B5;
    --garis:#2A3349;
    --garis-kuat:#3C476180;
    --stempel:#EC5C55;
    --lunas:#43AE86;
    --emas:#DCAE49;
    --emas-bg:#2E2718;
    --lunas-bg:#16302A;
    --stempel-bg:#331A1A;
    --shadow:0 1px 0 var(--garis), 0 8px 22px -14px #000;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--kertas);
    color:var(--tinta);
    font-family:"Asap","Segoe UI",system-ui,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

  /* ---------- bar atas ---------- */
  .bar{
    position:sticky;top:0;z-index:20;
    background:var(--kertas);
    border-bottom:1px solid var(--garis);
    padding-block:10px;
    display:flex;align-items:center;gap:12px;
  }
  .bar-merek{
    font-family:"Archivo Black",Impact,sans-serif;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--stempel);
    line-height:1;
  }
  .dots{display:flex;gap:5px;margin-left:auto}
  .dot{width:9px;height:9px;border:1.5px solid var(--garis-kuat);border-radius:2px;background:transparent}
  .dot.on{background:var(--lunas);border-color:var(--lunas)}
  .dot.now{border-color:var(--stempel);background:var(--stempel)}
  .skor{
    font-family:"Courier Prime",monospace;font-weight:700;font-size:14px;
    background:var(--emas-bg);color:var(--emas);
    border:1px solid var(--emas);
    padding:2px 8px;border-radius:3px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }

  /* ---------- teks ---------- */
  h1,h2,h3{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;text-wrap:balance;margin:0}
  h1{font-size:clamp(28px,8vw,38px);line-height:1.02;letter-spacing:-.01em}
  h2{font-size:22px;line-height:1.15;margin-bottom:6px}
  h3{font-size:15px;letter-spacing:.02em}
  p{margin:0 0 12px}
  .eyebrow{
    font-family:"Courier Prime",monospace;font-weight:700;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--tinta-2);margin-bottom:10px;
  }
  .kecil{font-size:14px;color:var(--tinta-2)}
  .ayat{
    font-family:"Courier Prime",monospace;font-size:14.5px;line-height:1.6;
    background:var(--kartu-2);
    border-left:3px solid var(--stempel);
    padding:12px 14px;margin:0 0 14px;
  }
  .ayat b{color:var(--stempel)}
  .rujukan{display:block;margin-top:6px;font-weight:700;letter-spacing:.06em;font-size:12px;text-transform:uppercase;color:var(--tinta-2)}

  /* ---------- kartu ---------- */
  .kartu{
    background:var(--kartu);
    border:1px solid var(--garis);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:14px;
  }
  .perf{border-top:2px dashed var(--garis-kuat);margin-top:14px;padding-top:14px}

  /* ---------- tombol ---------- */
  button{font-family:inherit;font-size:16px;cursor:pointer}
  .tbl{
    display:block;width:100%;
    background:var(--tinta);color:var(--kertas);
    border:none;border-radius:6px;
    padding:14px 16px;
    font-weight:700;letter-spacing:.02em;
    transition:transform .08s ease, filter .15s ease;
  }
  .tbl:hover{filter:brightness(1.15)}
  .tbl:active{transform:translateY(1px)}
  .tbl.merah{background:var(--stempel);color:#fff}
  .tbl.garis{background:transparent;color:var(--tinta);border:1.5px solid var(--garis-kuat);font-weight:600}
  .tbl[disabled]{opacity:.45;cursor:not-allowed}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tbl-kecil{
    background:transparent;border:1.5px solid var(--garis-kuat);color:var(--tinta);
    border-radius:5px;padding:7px 12px;font-size:14px;font-weight:600;
  }
  a{color:var(--stempel)}
  :focus-visible{outline:2.5px solid var(--stempel);outline-offset:2px}

  /* ---------- angka & kwitansi ---------- */
  .rp{font-family:"Courier Prime",monospace;font-variant-numeric:tabular-nums;font-weight:700}
  .baris{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-family:"Courier Prime",monospace;font-size:14px;
    padding:5px 0;border-bottom:1px dotted var(--garis);
  }
  .baris span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
  .bar-progres{height:14px;background:var(--kartu-2);border:1px solid var(--garis-kuat);border-radius:2px;overflow:hidden;margin:10px 0 6px}
  .bar-progres div{height:100%;background:var(--stempel);width:0%;transition:width .2s ease}

  /* ---------- stempel ---------- */
  .stempel{
    display:inline-block;
    font-family:"Archivo Black",Impact,sans-serif;
    color:var(--stempel);
    border:4px solid var(--stempel);
    border-radius:6px;
    padding:6px 18px 4px;
    font-size:clamp(30px,10vw,46px);
    letter-spacing:.1em;
    transform:rotate(-8deg);
    opacity:.92;
    line-height:1;
  }
  .stempel-wrap{text-align:center;padding:18px 0 22px}
  .cap{
    display:inline-block;font-family:"Archivo Black",Impact,sans-serif;font-size:11px;
    letter-spacing:.12em;padding:3px 8px;border:2px solid currentColor;border-radius:3px;
    transform:rotate(-4deg);
  }
  .cap.rugi{color:var(--stempel)}
  .cap.untung{color:var(--lunas)}
  @media (prefers-reduced-motion: no-preference){
    .stempel{animation:cap .45s cubic-bezier(.2,1.5,.4,1) both}
    @keyframes cap{from{transform:rotate(-8deg) scale(2.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.92}}
  }

  /* ---------- kuis & sortir ---------- */
  .pil{
    display:block;width:100%;text-align:left;
    background:var(--kartu-2);border:1.5px solid var(--garis);
    border-radius:6px;padding:12px 14px;margin-bottom:8px;
    color:var(--tinta);font-size:15px;line-height:1.4;
  }
  .pil:hover{border-color:var(--garis-kuat)}
  .pil.benar{background:var(--lunas-bg);border-color:var(--lunas);color:var(--lunas);font-weight:600}
  .pil.salah{background:var(--stempel-bg);border-color:var(--stempel);color:var(--stempel)}
  .skenario{
    font-size:17px;line-height:1.45;min-height:5.2em;
    display:flex;align-items:center;
    background:var(--kartu-2);border:1px solid var(--garis);
    border-radius:8px;padding:16px;margin-bottom:14px;
  }
  .umpan{border-radius:6px;padding:11px 13px;font-size:14.5px;margin-bottom:12px;line-height:1.45}
  .umpan.ok{background:var(--lunas-bg);border:1px solid var(--lunas);color:var(--lunas)}
  .umpan.no{background:var(--stempel-bg);border:1px solid var(--stempel);color:var(--stempel)}
  .umpan b{font-family:"Archivo Black",Impact,sans-serif;letter-spacing:.04em}

  /* ---------- babak 1: ayat rumpang ---------- */
  .rumpang{font-size:18px;line-height:2.1}
  .slot{
    display:inline-block;min-width:110px;text-align:center;
    border-bottom:2.5px solid var(--garis-kuat);
    padding:1px 8px;margin:0 2px;
    font-weight:700;color:var(--tinta-2);cursor:pointer;
  }
  .slot.aktif{border-bottom-color:var(--stempel);background:var(--stempel-bg)}
  .slot.isi{color:var(--tinta);border-bottom-color:var(--tinta)}
  .slot.hadiah{color:var(--emas);border-bottom-color:var(--emas);background:var(--emas-bg)}
  .kantong{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
  .kata{
    background:var(--kartu-2);border:1.5px solid var(--garis-kuat);
    border-radius:20px;padding:6px 13px;font-size:14.5px;color:var(--tinta);
  }
  .kata.pakai{opacity:.3;text-decoration:line-through;pointer-events:none}

  /* ---------- babak 4: tiga tahap ---------- */
  .tiga{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tiga button{
    background:var(--kartu-2);border:1.5px solid var(--garis);border-radius:6px;
    padding:12px 4px;color:var(--tinta);font-weight:700;font-size:13px;line-height:1.2;
  }
  .tiga button small{display:block;font-weight:400;font-size:10.5px;color:var(--tinta-2);margin-top:3px;letter-spacing:.04em}

  /* ---------- babak 5: lelang ---------- */
  .lelang-baris{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--garis)}
  .lelang-baris .nama{flex:1;font-size:15px;line-height:1.3}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{
    width:34px;height:34px;border-radius:5px;border:1.5px solid var(--garis-kuat);
    background:var(--kartu-2);color:var(--tinta);font-size:19px;font-weight:700;line-height:1;
  }
  .stepper output{
    font-family:"Courier Prime",monospace;font-weight:700;font-size:16px;
    min-width:34px;text-align:center;font-variant-numeric:tabular-nums;
  }

  /* ---------- daftar babak di beranda ---------- */
  .daftar{display:flex;flex-direction:column;gap:0}
  .item{
    display:flex;gap:12px;align-items:flex-start;
    padding:13px 0;border-bottom:1px solid var(--garis);
    text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;
    color:var(--tinta);
  }
  .item:last-child{border-bottom:0}
  .nomor{
    font-family:"Courier Prime",monospace;font-weight:700;font-size:13px;
    border:1.5px solid var(--garis-kuat);border-radius:3px;
    width:26px;height:26px;display:grid;place-items:center;flex:none;margin-top:1px;
    color:var(--tinta-2);
  }
  .item.beres .nomor{background:var(--lunas);border-color:var(--lunas);color:#fff}
  .item .judul{display:block;font-weight:700;font-size:15.5px;line-height:1.25}
  .item .ket{display:block;font-size:13.5px;color:var(--tinta-2);line-height:1.35;margin-top:1px}

  input[type=text],textarea{
    width:100%;font-family:inherit;font-size:16px;color:var(--tinta);
    background:var(--kartu-2);border:1.5px solid var(--garis);border-radius:6px;
    padding:11px 12px;
  }
  textarea{resize:vertical;min-height:70px}
  label{display:block;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:5px}
  .medan{margin-bottom:14px}

  .guru-blok{border-top:1px solid var(--garis);padding-top:14px;margin-top:14px}
  .guru-blok h3{color:var(--stempel);margin-bottom:6px}
  .guru-blok ul{margin:0 0 10px;padding-left:18px;font-size:14.5px}
  .guru-blok li{margin-bottom:5px}
  .waktu{font-family:"Courier Prime",monospace;font-weight:700;font-size:12.5px;color:var(--tinta-2);letter-spacing:.04em}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:6px 8px 6px 0;border-bottom:1px solid var(--garis);vertical-align:top}
  td:first-child{font-family:"Courier Prime",monospace;font-weight:700;white-space:nowrap;color:var(--tinta-2)}
  .gulir{overflow-x:auto}

  /* ---------- tambahan v2 ---------- */
  .skor.lunas{background:var(--lunas-bg);color:var(--lunas);border-color:var(--lunas);font-family:"Archivo Black",Impact,sans-serif;font-weight:400;letter-spacing:.08em}
  .bar-merek{cursor:default;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;padding:6px 0}
  .baris.teks span:first-child{flex:none}
  .baris.teks span:last-child{flex:1;white-space:normal;text-align:right}
  .coret{text-decoration:line-through;text-decoration-thickness:2px;color:var(--tinta-2)}
  .umpan.emas{background:var(--emas-bg);border:1px solid var(--emas);color:var(--tinta)}
  .rahasia{margin-top:14px;padding:14px;border:1.5px dashed var(--garis-kuat);border-radius:8px;background:var(--kartu-2)}
  .rahasia textarea{background:var(--kartu)}
  .pengakuan{font-size:17px;line-height:1.5;overflow-wrap:anywhere}
  h2{overflow-wrap:anywhere}
  button.slot{font:inherit;font-weight:700;background:transparent;border:0;border-bottom:2.5px solid var(--garis-kuat);border-radius:0;min-height:1.6em;vertical-align:baseline}
  button.slot.aktif{border-bottom-color:var(--stempel);background:var(--stempel-bg)}
  button.slot.isi{color:var(--tinta);border-bottom-color:var(--tinta)}
  .item.penutup .nomor{border-style:dashed}
  .item.penutup.beres .nomor{border-style:solid}
  .stempel.diam{animation:none}
  .stempel-wrap{overflow-x:clip;overflow-y:visible}
  .wrap{overflow-x:clip}

  /* ---------- tambahan v3: sinkron ---------- */
  #banner{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--emas-bg);border:1px solid var(--emas);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tunggu{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px dashed var(--garis-kuat);border-radius:8px;font-size:15px;line-height:1.4;margin-top:4px}
  .denyut{flex:none;width:12px;height:12px;border-radius:50%;background:var(--lunas)}
  @media (prefers-reduced-motion: no-preference){
    .denyut{animation:denyut 1.6s ease-in-out infinite}
    @keyframes denyut{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  }
  .skor.guru{background:var(--kartu-2);color:var(--tinta);border-color:var(--garis-kuat)}
  .angka-besar{font-family:"Archivo Black",Impact,sans-serif;font-size:44px;line-height:1;margin:4px 0 10px}
  .angka-besar span{font-family:"Asap",system-ui,sans-serif;font-size:16px;color:var(--tinta-2);margin-left:6px;font-weight:600}
  .minta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:6px;background:var(--emas-bg);border:1px solid var(--emas);font-size:15px}
  .tbl-kecil.merah{background:var(--stempel);border-color:var(--stempel);color:#fff}
  .baris.benar-g{color:var(--lunas);font-weight:700}
  .tabel-anak td{padding:8px 6px 8px 0;font-family:inherit;font-weight:400;color:var(--tinta);vertical-align:middle}
  .tabel-anak td:first-child{font-family:inherit;font-weight:700;color:var(--tinta)}
  .tabel-anak td.st{color:var(--tinta-2);font-size:13px}
  .tabel-anak td.sk{text-align:right;font-family:"Courier Prime",monospace;font-weight:700;white-space:nowrap}
  .on-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lunas);margin-right:8px;vertical-align:middle}
  .on-dot.mati{background:var(--garis-kuat)}
  .lunas-teks{color:var(--lunas);font-family:"Archivo Black",Impact,sans-serif;font-weight:400;letter-spacing:.06em}
  .hapus{background:none;border:0;color:var(--tinta-2);font-size:20px;line-height:1;padding:4px 8px}
  .lompatan{display:flex;flex-wrap:wrap;gap:6px}
  .lompat{background:var(--kartu-2);border:1.5px solid var(--garis);border-radius:5px;padding:7px 10px;font-size:13.5px;color:var(--tinta);font-weight:600}
  .lompat.kini{border-color:var(--stempel);color:var(--stempel)}
  .panduan summary{cursor:pointer;list-style:none}
  .panduan summary::-webkit-details-marker{display:none}
  .panduan summary h3{display:inline}
  .panduan summary::after{content:" +";color:var(--tinta-2);font-weight:700}
  .panduan[open] summary::after{content:" −"}
</style>

<div class="wrap">
  <header class="bar">
    <div class="bar-merek" id="merek">Lunas</div>
    <div class="dots" id="dots"></div>
    <div class="skor" id="skor">0 pts</div>
  </header>
  <div id="banner" hidden></div>
  <main id="app"></main>
</div>

<script>
"use strict";
/* =========================================================
   PENGATURAN — ubah di sini
   ========================================================= */
var CONFIG = {
  // Sama dengan databaseURL di project Pelita. Boleh juga tempel seluruh firebaseConfig.
  firebase: {
    databaseURL: "https://test-7157e-default-rtdb.asia-southeast1.firebasedatabase.app"
  },
  kelas: "cg9",   // bisa ditimpa lewat link: ?kelas=cg10
  PIN: "0909"     // PIN panel guru — GANTI sebelum dipakai
};

var Q = new URLSearchParams(location.search);
var KELAS = (Q.get("kelas") || CONFIG.kelas).replace(/[^a-z0-9_-]/gi, "").toLowerCase() || "cg9";
var ROOT = "lunas/" + KELAS;
var MODE_GURU = location.hash === "#guru" || Q.has("guru");

/* =========================================================
   LAPISAN DATABASE: Firebase, atau "demo" (antar-tab, untuk uji coba)
   ========================================================= */
var DB = (function(){
  if(!Q.has("demo") && window.firebase && firebase.initializeApp){
    try{
      firebase.initializeApp(CONFIG.firebase);
      var db = firebase.database();
      return {
        mode:"fb",
        on:function(p, cb){ db.ref(p).on("value", function(s){ cb(s.val()); }); },
        set:function(p, v){ return db.ref(p).set(v); },
        update:function(p, o){ return db.ref(p).update(o); },
        remove:function(p){ return db.ref(p).remove(); },
        hadir:function(p){
          db.ref(".info/connected").on("value", function(s){
            if(s.val()){ db.ref(p).onDisconnect().set(false); db.ref(p).set(true); }
          });
        },
        koneksi:function(cb){ db.ref(".info/connected").on("value", function(s){ cb(!!s.val()); }); }
      };
    }catch(e){ console.error(e); }
  }
  if(!Q.has("demo")) return {mode:"putus", on:function(){}, set:tolak, update:tolak, remove:tolak, hadir:function(){}, koneksi:function(cb){ cb(false); }};
  function tolak(){ return Promise.resolve(); }

  /* Data demo disimpan per "shard" (ctrl, dan tiap anak terpisah) supaya tab-tab tidak saling menimpa. */
  var KEY = "lunas-demo|";
  var bc = ("BroadcastChannel" in window) ? new BroadcastChannel("lunas-demo") : null;
  var dengar = [];
  function jalur(p){ return p.split("/").filter(Boolean); }
  function dalamShard(s){ return s[2] === "anak" ? 4 : 3; }
  function baca(){
    var t = {};
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(k.indexOf(KEY) !== 0) continue;
      try{ pasang(t, k.slice(KEY.length), JSON.parse(localStorage.getItem(k))); }catch(e){}
    }
    return t;
  }
  function ambil(t, p){ var s = jalur(p); for(var i=0;i<s.length;i++){ if(t == null || typeof t !== "object") return null; t = t[s[i]]; } return t === undefined ? null : t; }
  function pasang(t, p, v){
    var s = jalur(p), o = t;
    if(!s.length) return v;
    for(var i=0;i<s.length-1;i++){ if(typeof o[s[i]] !== "object" || o[s[i]] === null) o[s[i]] = {}; o = o[s[i]]; }
    if(v === null || v === undefined) delete o[s[s.length-1]]; else o[s[s.length-1]] = v;
    return t;
  }
  function tulisJalur(p, v){
    var s = jalur(p), d = dalamShard(s);
    if(s.length < d){
      var awalan = KEY + s.join("/");
      var hapus = [];
      for(var i=0;i<localStorage.length;i++){ var k = localStorage.key(i); if(k === awalan || k.indexOf(awalan + "/") === 0) hapus.push(k); }
      hapus.forEach(function(k){ localStorage.removeItem(k); });
      if(v !== null && v !== undefined){
        if(s.length === d - 1 && typeof v === "object"){ for(var c in v) tulisJalur(p + "/" + c, v[c]); }
        else localStorage.setItem(awalan, JSON.stringify(v));
      }
      return;
    }
    var kunciShard = KEY + s.slice(0, d).join("/"), sisa = s.slice(d).join("/");
    var isi = null;
    try{ isi = JSON.parse(localStorage.getItem(kunciShard)); }catch(e){}
    if(sisa){ if(typeof isi !== "object" || isi === null) isi = {}; isi = pasang(isi, sisa, v); }
    else isi = v;
    if(isi === null || isi === undefined) localStorage.removeItem(kunciShard);
    else localStorage.setItem(kunciShard, JSON.stringify(isi));
  }
  function selesai(){ if(bc) bc.postMessage(1); setTimeout(kabari, 0); }
  function kabari(){
    var t = baca();
    for(var i=0;i<dengar.length;i++){
      var l = dengar[i], v = ambil(t, l.p), j = JSON.stringify(v);
      if(j !== l.j){ l.j = j; l.cb(v == null ? null : JSON.parse(j)); }
    }
  }
  // Hanya dengar sinyal "selesai menulis" supaya tidak pernah membaca keadaan setengah jadi (meniru update atomik Firebase).
  if(bc) bc.onmessage = kabari;
  else window.addEventListener("storage", kabari);
  return {
    mode:"demo",
    on:function(p, cb){ dengar.push({p:p, cb:cb, j:undefined}); setTimeout(kabari, 0); },
    set:function(p, v){ tulisJalur(p, JSON.parse(JSON.stringify(v))); selesai(); return Promise.resolve(); },
    update:function(p, o){ for(var k in o) tulisJalur(p + "/" + k, JSON.parse(JSON.stringify(o[k]))); selesai(); return Promise.resolve(); },
    remove:function(p){ tulisJalur(p, null); selesai(); return Promise.resolve(); },
    hadir:function(p){ this.set(p, true); },
    koneksi:function(cb){ setTimeout(function(){ cb(true); }, 0); }
  };
})();

    for(var a=0;a<slots.length;a++){
      slots[a].addEventListener("click", function(){
        var n = +this.getAttribute("data-slot");

          + (MANDIRI ? '<button class="tbl merah" id="beri">Guru: berikan kata yang hilang</button>'
                     : '<button class="tbl-kecil" id="beri">Guru: berikan langsung di HP ini</button>');
      }
    }
    document.getElementById("aksi1").innerHTML = h;
    document.getElementById("cek").addEventListener("click", periksa);
    var mi = document.getElementById("minta");

function nomorBabak(id){ return id.slice(1); }
function layarSoal(id){
  var L = LOCK[id], i = CTRL.soal, key = id + "_" + i;
  if(i >= L.data.length) return ringkasan(id);
  var jw = S.jawab[key];
  if(CTRL.buka) return umpanSoal(id, i, jw);
  if(jw !== undefined) return terkunci(id, i, jw);
  var pil = L.pilihan(i), h = "";
  if(L.jenis === "duo"){
    h = '<div class="duo">' + pil.map(function(p){ return '<button class="tbl garis" data-v="' + p.v + '">' + p.l + '</button>'; }).join("") + '</div>';
  } else if(L.jenis === "tiga"){
    h = '<div class="tiga">' + pil.map(function(p){ return '<button data-v="' + p.v + '">' + p.l + '</button>'; }).join("") + '</div>';
  } else {
    h = pil.map(function(p){ return '<button class="pil" data-v="' + p.v + '">' + p.l + '</button>'; }).join("");
  }
  app.innerHTML =
    '<div class="kartu">'
    + '<p class="eyebrow">Babak ' + nomorBabak(id) + ' &middot; ' + (i+1) + ' dari ' + L.data.length + '</p>'
    + (id === "b6" ? '<div class="bar-progres"><div id="jam" style="width:100%;transition:width 1s linear"></div></div>' : '')
    + '<div class="skenario">' + L.teks(i) + '</div>'
    + h + '</div>' + L.catatan;
  var b = app.querySelectorAll("[data-v]");
  for(var x=0;x<b.length;x++) b[x].addEventListener("click", function(){
    var v = this.getAttribute("data-v");
    jawab(id, i, id === "b6" ? +v : v);
  });
  if(id === "b6"){
    var sisa = DETIK;
    jamB6 = setInterval(function(){
      sisa--;
      var j = document.getElementById("jam");
      if(j) j.style.width = Math.max(0, sisa/DETIK*100) + "%";
      if(sisa <= 0){ clearInterval(jamB6); jawab(id, i, -1); }
    }, 1000);
  }
}
function jawab(id, i, v){
  clearInterval(jamB6);
  var key = id + "_" + i;
  if(S.jawab[key] !== undefined) return;
  S.jawab[key] = v; simpan(); kirim();
  if(MANDIRI) CTRL.buka = true;
  render(true);
}
function terkunci(id, i, jw){
  var L = LOCK[id];
  app.innerHTML =
    '<div class="kartu">'
    + '<p class="eyebrow">Babak ' + nomorBabak(id) + ' &middot; ' + (i+1) + ' dari ' + L.data.length + '</p>'
    + '<div class="skenario">' + L.teks(i) + '</div>'
    + '<div class="baris" style="border-bottom:0"><span>Jawabanmu</span><span>' + labelPilihan(id, i, jw) + '</span></div>'
    + '</div>'
    + '<div class="tunggu"><span class="denyut"></span><div><b>Terkunci.</b> Tunggu teman-teman, lalu guru membuka jawabannya.</div></div>';
}
function beriPoinSoal(id){
  var L = LOCK[id], batas = Math.min(CTRL.buka ? CTRL.soal + 1 : CTRL.soal, L.data.length), tambah = 0;
  for(var i=0;i<batas;i++){

    if(!S.dapat[key] && S.jawab[key] === L.benar(i)){ S.dapat[key] = true; tambah += 10; }

}

function daftarAnak(){
  var out = [];
  for(var id in G.anak){ var a = G.anak[id]; if(a && a.nama) out.push(Object.assign({id:id}, a)); }
  out.sort(function(x, y){ return (y.skor || 0) - (x.skor || 0) || String(x.nama).localeCompare(String(y.nama)); });
  return out;
}
function statusAnak(a){
  var c = G.ctrl, t = c.tahap, jw = a.jawab || {}, br = a.beres || {};
  if(t === "lobi") return a.online === false ? "offline" : "siap";
  if(t === "b1"){ if(br.b1) return "&#10003; selesai"; return a.minta ? "&#9995; minta tolong" : "mengerjakan"; }
  if(t === "b2" || t === "b5") return br[t] ? "&#10003; selesai" : "mengerjakan";
  if(LOCK[t]){
    if(c.soal >= LOCK[t].data.length) return br[t] ? "&#10003;" : "";
    var v = jw[t + "_" + c.soal];
    if(v === undefined) return "belum";
    if(!c.buka) return "&#10003; sudah";
    return v === LOCK[t].benar(c.soal) ? "benar" : "salah";
  }
  if(t === "akhir") return a.lunas ? "" : (a.ditolak ? "ditolak" : "belum bayar");
  return "";
}

  el.innerHTML =
    '<div class="kartu" style="margin-top:14px">'
    + '<p class="eyebrow">Panel guru &middot; kelas ' + esc(KELAS) + ' &middot; ' + (G.koneksi ? "tersambung" : "TERPUTUS") + (DB.mode === "demo" ? " &middot; DEMO" : "") + '</p>'
    + '<h2>' + NAMA_TAHAP[t] + '</h2>'
    + '<div class="perf">' + kontrol + '</div></div>'
    + '<div class="kartu"><p class="eyebrow">Anak (' + n + ')</p>'
    + (n ? '<div class="gulir"><table class="tabel-anak">' + tabel + '</table></div>' : '<p class="kecil" style="margin:0">Belum ada.</p>')
    + '</div>'
    + '<div class="kartu"><p class="eyebrow">Loncat ke tahap</p><div class="lompatan">' + loncat + '</div>'
    + '<div class="perf"><button class="tbl-kecil" data-g="baru">Mulai sesi baru (hapus semua skor)</button></div></div>';
}
function tombolG(teks, aksi, t, kls){
  return '<div style="height:12px"></div><button class="tbl ' + (kls || "") + '" data-g="' + aksi + '"' + (t ? ' data-t="' + t + '"' : '') + '>' + teks + '</button>';
}
function aksiGuru(e){
  var b = e.target.closest("[data-g]");
  if(!b) return;
  var a = b.getAttribute("data-g"), c = G.ctrl, P = ROOT + "/ctrl";
  if(a === "ke") DB.update(P, {tahap:b.getAttribute("data-t"), soal:0, buka:false});
  else if(a === "buka") DB.update(P, {buka:true});
  else if(a === "berikut") DB.update(P, {soal:c.soal + 1, buka:false});
  else if(a === "tutup") DB.update(P, {soal:LOCK[c.tahap].data.length, buka:false});
  else if(a === "beri") DB.set(ROOT + "/anak/" + b.getAttribute("data-id") + "/diberi", true);
  else if(a === "hapus"){
    if(confirm("Hapus anak ini dari daftar? (Kalau HP-nya masih terbuka, dia akan muncul lagi.)")) DB.remove(ROOT + "/anak/" + b.getAttribute("data-id"));
  }
  else if(a === "baru"){
    if(confirm("Mulai sesi baru? Semua skor dan jawaban kelas " + KELAS + " dihapus, semua HP kembali ke ruang tunggu.")){
      DB.remove(ROOT + "/anak").then(function(){ DB.set(P, {tahap:"lobi", soal:0, buka:false, sesi:Date.now()}); });
    }
  }
}
