<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stempel LUNAS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Asap:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
  :root{
    --kertas:#EDEFF1;
    --kartu:#FCFCFA;
    --kartu-2:#F3F4F1;
    --tinta:#151B2E;
    --tinta-2:#5C6879;
    --garis:#D2D7DD;
    --garis-kuat:#B6BEC8;
    --stempel:#BE2A25;
    --lunas:#1A7052;
    --emas:#9A6B10;
    --emas-bg:#F6EBCF;
    --lunas-bg:#E2F0EA;
    --stempel-bg:#F8E5E3;
    --radius:10px;
    --shadow:0 1px 0 var(--garis), 0 6px 18px -12px rgba(21,27,46,.35);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --kertas:#0D1220;
      --kartu:#171E30;
      --kartu-2:#1E263A;
      --tinta:#E8EBF1;
      --tinta-2:#95A0B5;
      --garis:#2A3349;
      --garis-kuat:#3C476180;
      --stempel:#EC5C55;
      --lunas:#43AE86;
      --emas:#DCAE49;
      --emas-bg:#2E2718;
      --lunas-bg:#16302A;
      --stempel-bg:#331A1A;
      --shadow:0 1px 0 var(--garis), 0 8px 22px -14px #000;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --kertas:#0D1220;
    --kartu:#171E30;
    --kartu-2:#1E263A;
    --tinta:#E8EBF1;
    --tinta-2:#95A0B5;
    --garis:#2A3349;
    --garis-kuat:#3C476180;
    --stempel:#EC5C55;
    --lunas:#43AE86;
    --emas:#DCAE49;
    --emas-bg:#2E2718;
    --lunas-bg:#16302A;
    --stempel-bg:#331A1A;
    --shadow:0 1px 0 var(--garis), 0 8px 22px -14px #000;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--kertas);
    color:var(--tinta);
    font-family:"Asap","Segoe UI",system-ui,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

  /* ---------- bar atas ---------- */
  .bar{
    position:sticky;top:0;z-index:20;
    background:var(--kertas);
    border-bottom:1px solid var(--garis);
    padding-block:10px;
    display:flex;align-items:center;gap:12px;
  }
  .bar-merek{
    font-family:"Archivo Black",Impact,sans-serif;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--stempel);
    line-height:1;
  }
  .dots{display:flex;gap:5px;margin-left:auto}
  .dot{width:9px;height:9px;border:1.5px solid var(--garis-kuat);border-radius:2px;background:transparent}
  .dot.on{background:var(--lunas);border-color:var(--lunas)}
  .dot.now{border-color:var(--stempel);background:var(--stempel)}
  .skor{
    font-family:"Courier Prime",monospace;font-weight:700;font-size:14px;
    background:var(--emas-bg);color:var(--emas);
    border:1px solid var(--emas);
    padding:2px 8px;border-radius:3px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }

  /* ---------- teks ---------- */
  h1,h2,h3{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;text-wrap:balance;margin:0}
  h1{font-size:clamp(28px,8vw,38px);line-height:1.02;letter-spacing:-.01em}
  h2{font-size:22px;line-height:1.15;margin-bottom:6px}
  h3{font-size:15px;letter-spacing:.02em}
  p{margin:0 0 12px}
  .eyebrow{
    font-family:"Courier Prime",monospace;font-weight:700;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--tinta-2);margin-bottom:10px;
  }
  .kecil{font-size:14px;color:var(--tinta-2)}
  .ayat{
    font-family:"Courier Prime",monospace;font-size:14.5px;line-height:1.6;
    background:var(--kartu-2);
    border-left:3px solid var(--stempel);
    padding:12px 14px;margin:0 0 14px;
  }
  .ayat b{color:var(--stempel)}
  .rujukan{display:block;margin-top:6px;font-weight:700;letter-spacing:.06em;font-size:12px;text-transform:uppercase;color:var(--tinta-2)}

  /* ---------- kartu ---------- */
  .kartu{
    background:var(--kartu);
    border:1px solid var(--garis);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:14px;
  }
  .perf{border-top:2px dashed var(--garis-kuat);margin-top:14px;padding-top:14px}

  /* ---------- tombol ---------- */
  button{font-family:inherit;font-size:16px;cursor:pointer}
  .tbl{
    display:block;width:100%;
    background:var(--tinta);color:var(--kertas);
    border:none;border-radius:6px;
    padding:14px 16px;
    font-weight:700;letter-spacing:.02em;
    transition:transform .08s ease, filter .15s ease;
  }
  .tbl:hover{filter:brightness(1.15)}
  .tbl:active{transform:translateY(1px)}
  .tbl.merah{background:var(--stempel);color:#fff}
  .tbl.garis{background:transparent;color:var(--tinta);border:1.5px solid var(--garis-kuat);font-weight:600}
  .tbl[disabled]{opacity:.45;cursor:not-allowed}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tbl-kecil{
    background:transparent;border:1.5px solid var(--garis-kuat);color:var(--tinta);
    border-radius:5px;padding:7px 12px;font-size:14px;font-weight:600;
  }
  a{color:var(--stempel)}
  :focus-visible{outline:2.5px solid var(--stempel);outline-offset:2px}

  /* ---------- angka & kwitansi ---------- */
  .rp{font-family:"Courier Prime",monospace;font-variant-numeric:tabular-nums;font-weight:700}
  .baris{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-family:"Courier Prime",monospace;font-size:14px;
    padding:5px 0;border-bottom:1px dotted var(--garis);
  }
  .baris span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
  .bar-progres{height:14px;background:var(--kartu-2);border:1px solid var(--garis-kuat);border-radius:2px;overflow:hidden;margin:10px 0 6px}
  .bar-progres div{height:100%;background:var(--stempel);width:0%;transition:width .2s ease}

  /* ---------- stempel ---------- */
  .stempel{
    display:inline-block;
    font-family:"Archivo Black",Impact,sans-serif;
    color:var(--stempel);
    border:4px solid var(--stempel);
    border-radius:6px;
    padding:6px 18px 4px;
    font-size:clamp(30px,10vw,46px);
    letter-spacing:.1em;
    transform:rotate(-8deg);
    opacity:.92;
    line-height:1;
  }
  .stempel-wrap{text-align:center;padding:18px 0 22px}
  .cap{
    display:inline-block;font-family:"Archivo Black",Impact,sans-serif;font-size:11px;
    letter-spacing:.12em;padding:3px 8px;border:2px solid currentColor;border-radius:3px;
    transform:rotate(-4deg);
  }
  .cap.rugi{color:var(--stempel)}
  .cap.untung{color:var(--lunas)}
  @media (prefers-reduced-motion: no-preference){
    .stempel{animation:cap .45s cubic-bezier(.2,1.5,.4,1) both}
    @keyframes cap{from{transform:rotate(-8deg) scale(2.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.92}}
  }

  /* ---------- kuis & sortir ---------- */
  .pil{
    display:block;width:100%;text-align:left;
    background:var(--kartu-2);border:1.5px solid var(--garis);
    border-radius:6px;padding:12px 14px;margin-bottom:8px;
    color:var(--tinta);font-size:15px;line-height:1.4;
  }
  .pil:hover{border-color:var(--garis-kuat)}
  .pil.benar{background:var(--lunas-bg);border-color:var(--lunas);color:var(--lunas);font-weight:600}
  .pil.salah{background:var(--stempel-bg);border-color:var(--stempel);color:var(--stempel)}
  .skenario{
    font-size:17px;line-height:1.45;min-height:5.2em;
    display:flex;align-items:center;
    background:var(--kartu-2);border:1px solid var(--garis);
    border-radius:8px;padding:16px;margin-bottom:14px;
  }
  .umpan{border-radius:6px;padding:11px 13px;font-size:14.5px;margin-bottom:12px;line-height:1.45}
  .umpan.ok{background:var(--lunas-bg);border:1px solid var(--lunas);color:var(--lunas)}
  .umpan.no{background:var(--stempel-bg);border:1px solid var(--stempel);color:var(--stempel)}
  .umpan b{font-family:"Archivo Black",Impact,sans-serif;letter-spacing:.04em}

  /* ---------- babak 1: ayat rumpang ---------- */
  .rumpang{font-size:18px;line-height:2.1}
  .slot{
    display:inline-block;min-width:110px;text-align:center;
    border-bottom:2.5px solid var(--garis-kuat);
    padding:1px 8px;margin:0 2px;
    font-weight:700;color:var(--tinta-2);cursor:pointer;
  }
  .slot.aktif{border-bottom-color:var(--stempel);background:var(--stempel-bg)}
  .slot.isi{color:var(--tinta);border-bottom-color:var(--tinta)}
  .slot.hadiah{color:var(--emas);border-bottom-color:var(--emas);background:var(--emas-bg)}
  .kantong{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
  .kata{
    background:var(--kartu-2);border:1.5px solid var(--garis-kuat);
    border-radius:20px;padding:6px 13px;font-size:14.5px;color:var(--tinta);
  }
  .kata.pakai{opacity:.3;text-decoration:line-through;pointer-events:none}

  /* ---------- babak 4: tiga tahap ---------- */
  .tiga{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tiga button{
    background:var(--kartu-2);border:1.5px solid var(--garis);border-radius:6px;
    padding:12px 4px;color:var(--tinta);font-weight:700;font-size:13px;line-height:1.2;
  }
  .tiga button small{display:block;font-weight:400;font-size:10.5px;color:var(--tinta-2);margin-top:3px;letter-spacing:.04em}

  /* ---------- babak 5: lelang ---------- */
  .lelang-baris{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--garis)}
  .lelang-baris .nama{flex:1;font-size:15px;line-height:1.3}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{
    width:34px;height:34px;border-radius:5px;border:1.5px solid var(--garis-kuat);
    background:var(--kartu-2);color:var(--tinta);font-size:19px;font-weight:700;line-height:1;
  }
  .stepper output{
    font-family:"Courier Prime",monospace;font-weight:700;font-size:16px;
    min-width:34px;text-align:center;font-variant-numeric:tabular-nums;
  }

  /* ---------- daftar babak di beranda ---------- */
  .daftar{display:flex;flex-direction:column;gap:0}
  .item{
    display:flex;gap:12px;align-items:flex-start;
    padding:13px 0;border-bottom:1px solid var(--garis);
    text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;
    color:var(--tinta);
  }
  .item:last-child{border-bottom:0}
  .no{
    font-family:"Courier Prime",monospace;font-weight:700;font-size:13px;
    border:1.5px solid var(--garis-kuat);border-radius:3px;
    width:26px;height:26px;display:grid;place-items:center;flex:none;margin-top:1px;
    color:var(--tinta-2);
  }
  .item.beres .no{background:var(--lunas);border-color:var(--lunas);color:#fff}
  .item .judul{display:block;font-weight:700;font-size:15.5px;line-height:1.25}
  .item .ket{display:block;font-size:13.5px;color:var(--tinta-2);line-height:1.35;margin-top:1px}

  input[type=text],textarea{
    width:100%;font-family:inherit;font-size:16px;color:var(--tinta);
    background:var(--kartu-2);border:1.5px solid var(--garis);border-radius:6px;
    padding:11px 12px;
  }
  textarea{resize:vertical;min-height:70px}
  label{display:block;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:5px}
  .medan{margin-bottom:14px}

  .guru-blok{border-top:1px solid var(--garis);padding-top:14px;margin-top:14px}
  .guru-blok h3{color:var(--stempel);margin-bottom:6px}
  .guru-blok ul{margin:0 0 10px;padding-left:18px;font-size:14.5px}
  .guru-blok li{margin-bottom:5px}
  .waktu{font-family:"Courier Prime",monospace;font-weight:700;font-size:12.5px;color:var(--tinta-2);letter-spacing:.04em}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:6px 8px 6px 0;border-bottom:1px solid var(--garis);vertical-align:top}
  td:first-child{font-family:"Courier Prime",monospace;font-weight:700;white-space:nowrap;color:var(--tinta-2)}
  .gulir{overflow-x:auto}
  /* ---------- tombol bahasa ---------- */
  .bahasa{display:flex;border:1.5px solid var(--garis-kuat);border-radius:4px;overflow:hidden;flex:none}
  .bahasa button{
    background:transparent;border:0;color:var(--tinta-2);
    font-family:"Courier Prime",monospace;font-weight:700;font-size:12.5px;letter-spacing:.06em;
    padding:4px 8px;line-height:1.2;
  }
  .bahasa button[aria-pressed="true"]{background:var(--tinta);color:var(--kertas)}
  .dots{margin-left:auto}
  @media (max-width:360px){ .dots{display:none} .bahasa{margin-left:auto} }
</style>

<div class="wrap">
  <header class="bar">
    <div class="bar-merek" id="merek">Lunas</div>
    <div class="dots" id="dots"></div>
    <div class="bahasa" role="group" aria-label="Bahasa / Language">
      <button type="button" id="lang-id" data-lang="id">ID</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>
    <div class="skor" id="skor">0 pts</div>
  </header>
  <main id="app"></main>
</div>

<script>
"use strict";

var BAHASA_TETAP = "id"; /* "id" atau "en" = file satu bahasa, tombol ID|EN disembunyikan */
var KUNCI = "lunas-cg9-v1";
var S = {nama:"", skor:0, beres:{}, akuan:{tinggal:"", iman:""}, lelang:null, lang:"id"};
try{ var m = localStorage.getItem(KUNCI); if(m) S = Object.assign(S, JSON.parse(m)); }catch(e){}
if(BAHASA_TETAP){ S.lang = BAHASA_TETAP; document.querySelector(".bahasa").hidden = true; }
function simpan(){ try{ localStorage.setItem(KUNCI, JSON.stringify(S)); }catch(e){} }
function poin(n){ S.skor += n; simpan(); gambarBar(); }
function tandai(id){ S.beres[id] = true; simpan(); gambarBar(); }

/* =========================================================
   TEKS — dua bahasa. D() mengambil isi bahasa yang aktif.
   ========================================================= */
var ISI = {};

ISI.id = {
  locale:"id-ID",
  merek:"Lunas",
  triliun:" triliun",
  babak:[
    {id:"b1", judul:"Puzzle yang Mustahil", ket:"Susun ayat yang tidak mungkin kamu selesaikan sendiri."},
    {id:"b2", judul:"Uang Tebusan", ket:"Kumpulkan harga satu nyawa. Sampai kamu menyerah."},
    {id:"b3", judul:"Tobat atau Cuma Nyesel?", ket:"12 kejadian sehari-hari. Pilih yang benar."},
    {id:"b4", judul:"Tiga Tahap", ket:"Justifikasi, Pengudusan, Pemuliaan — taruh di tempatnya."},
    {id:"b5", judul:"Lelang Nilai Hidup", ket:"100 poin. Belanjakan. Lalu lihat kwitansi Paulus."},
    {id:"b6", judul:"Kuis Ayat", ket:"10 soal cepat. Ayat-ayat keselamatan."}
  ],
  u:{
    babakKe:function(n){ return "Babak " + n + " dari 6"; },
    selesai:function(n){ return "Babak " + n + " &middot; selesai"; },
    kembali:"Kembali ke daftar",
    lanjut:function(x){ return "Lanjut: " + x + " &rarr;"; },
    tepatDari:function(a,b){ return a + " dari " + b + " tepat"; },
    benarDari:function(a,b){ return a + " dari " + b + " benar"; },
    plus:function(n){ return "+" + n + " poin."; },
    lihatHasil:"Lihat hasilku",
    berikut:"Berikutnya &rarr;",
    TEPAT:"TEPAT", SALAH:"SALAH", BUKAN:"BUKAN", BENAR:"BENAR", HABIS:"WAKTU HABIS"
  },
  beranda:{
    eyebrow:"Cell Group 9 &middot; Keselamatan bagian 1",
    judul:"Utangmu<br>tidak bisa<br>kamu bayar.",
    intro:"Enam babak tentang apa itu keselamatan, apa itu penebusan, dan mengapa harganya hanya bisa dibayar oleh satu Orang. Mainkan di HP-mu sendiri. Guru memandu urutannya.",
    skor:"Skor kamu sekarang",
    kartu:"Kartu Pengakuan", guru:"Panel Guru", reset:"Mulai dari nol",
    tanyaReset:"Hapus semua skor dan jawaban di HP ini?"
  },
  b1:{
    judul:"Puzzle yang Mustahil",
    petunjuk:"Lengkapi Efesus 2:8-9. Ketuk garis kosong, lalu ketuk kata yang benar. Kamu punya waktu sampai guru bilang stop.",
    bagian:["Sebab karena ", 0, " kamu diselamatkan oleh ", 1, "; itu bukan hasil ", 2, ", tetapi ", 3, " Allah."],
    jawab:["kasih karunia", "iman", "usahamu", "pemberian"],
    kantong:["iman", "usahamu", "perbuatan baik", "rajin ibadah", "hafalan ayat", "uang persembahan"],
    ketukDulu:"Ketuk dulu garis kosong yang mau kamu isi.",
    periksa:"Periksa jawabanku",
    minta:"Minta kepada Guru",
    salah:function(n){ return "<b>Belum tepat.</b> Ada " + n + " kata yang salah tempat. Coba lagi."; },
    kurang:function(n){ return "<b>Masih kurang " + n + " kata.</b> Dan &mdash; periksa kantongmu. Dua kata itu memang tidak ada di sana."; },
    hasil:"<b>Dua kata yang kuning tadi tidak pernah ada di kantongmu.</b> Kamu bukan gagal karena kurang usaha. Kamu gagal karena bagian itu memang cuma bisa <i>diberi</i>.",
    ayat:'Sebab karena <b>kasih karunia</b> kamu diselamatkan oleh <b>iman</b>; itu bukan hasil usahamu, tetapi <b>pemberian Allah</b>, itu bukan hasil pekerjaanmu: jangan ada orang yang memegahkan diri.<span class="rujukan">Efesus 2:8-9</span>',
    poin:"<b>+30 poin.</b> Perhatikan: poin ini diberikan, bukan kamu menangkan. Persis seperti keselamatan."
  },
  b2:{
    judul:"Uang Tebusan",
    petunjuk:"Di depanmu ada satu tagihan: harga tebusan untuk <b>satu nyawa manusia</b> di hadapan Allah. Ketuk untuk mengumpulkan uang. Kumpulkan sebanyak mungkin.",
    harga:"Harga tebusan 1 nyawa", kumpul:"Sudah kamu kumpulkan", kurang:"Kekurangan",
    capai:function(p){ return "Kamu baru mencapai " + p + "%"; },
    tahun:function(n){ return " &middot; dengan kecepatan ini kamu butuh " + n + " tahun lagi"; },
    ketuk:"Ketuk: kumpulkan uang",
    menyerah:"Berhenti. Tidak akan pernah cukup.",
    eyebrow:"Babak 2 &middot; kamu benar berhenti",
    ayat1:'Tidak seorang pun dapat menebus hidup orang lain, atau memberikan uang tebusan kepada Allah ganti nyawanya, <b>karena terlalu mahal harga pembebasan nyawanya, tidak ada pembayaran yang cukup</b>, supaya ia tetap hidup untuk selama-lamanya.<span class="rujukan">Mazmur 49:8-10</span>',
    p1:"Bukan soal kamu kurang rajin mengetuk. Harga satu nyawa tidak pernah bisa dibayar oleh manusia &mdash; berapa pun yang kamu kumpulkan, dan walaupun seluruh kelas menggabungkan semuanya.",
    p2:"Yang bisa membayar hanya satu: <b>seorang yang tidak berdosa</b>. Orang berdosa tidak bisa mati untuk orang lain. Yesus membayar bukan dengan uang &mdash; dengan nyawa dan darah-Nya.",
    stempel:"LUNAS",
    tagihan:"Tagihan", tagihanIsi:"Upah dosa = maut (Rm 6:23)",
    oleh:"Dibayar oleh", olehIsi:"Yesus Kristus",
    alat:"Alat bayar", alatIsi:"Nyawa &amp; darah-Nya",
    duaKata:"Dua kata yang jangan tertukar",
    kSel:"Keselamatan", kSelIsi:"dilepaskan dari dosa<br>dan akibatnya: maut",
    kTeb:"Penebusan", kTebIsi:"dilepaskan juga &mdash; tetapi<br>ada harga yang dibayar",
    ayat2:'Atau tidak tahukah kamu, bahwa tubuhmu adalah bait Roh Kudus... <b>Kamu telah dibeli dan harganya telah dibayar</b>: Karena itu muliakanlah Allah dengan tubuhmu!<span class="rujukan">1 Korintus 6:19-20</span>',
    poin:"<b>+20 poin.</b> Karena kamu sudah dibayar, kamu bukan milikmu sendiri lagi. Kamu milik Kristus."
  },
  b3:{
    kartuKe:function(a,b,c){ return "Babak 3 &middot; kartu " + a + " dari " + b + " &middot; benar " + c; },

  guru:
    '<p class="eyebrow">Panel guru &middot; jangan dibuka bareng anak-anak</p>'
    + '<h2>Cara memandu sesi ini</h2>'
    + '<p class="kecil">Dirancang untuk 6 anak kelas 7, tiap anak satu HP, 50&ndash;60 menit. Kamu yang mengumumkan babak; anak menekan sendiri di HP-nya. Kunci suasana: <b>jangan ada blok bicara lebih dari 8 menit</b>.</p>'

    + '</ul></div>'
    + '<div class="guru-blok"><h3>Alur waktu</h3>'
    + '<div class="gulir"><table>'
    + '<tr><td>0&ndash;8</td><td><b>Babak 1 &mdash; Puzzle Mustahil.</b> Jangan bocorkan bahwa 2 kata tidak ada. Biarkan mereka frustrasi. Tanya: &ldquo;Siapa yang merasa kurang usaha?&rdquo;</td></tr>'

    + '<tr><td>20&ndash;28</td><td><b>Ajar singkat (maks 8 menit).</b> Bagaimana kita diselamatkan: dilahirkan kembali (Yoh 3:3), bertobat, percaya (Kis 16:31), mengaku (Rm 10:9-10). Semuanya anugerah, bukan usaha.</td></tr>'

    + '<tr><td>44&ndash;52</td><td><b>Babak 5 &mdash; Lelang Nilai Hidup.</b> Setelah palu diketuk, tanya satu per satu: &ldquo;kamu bayar 40 poin untuk apa?&rdquo; Baru buka kwitansi Paulus.</td></tr>'
    + '<tr><td>52&ndash;58</td><td><b>Babak 6 &mdash; Kuis Ayat.</b> Berdiri semua; yang salah duduk. Skor tetap dihitung di HP.</td></tr>'
    + '<tr><td>58&ndash;60</td><td><b>Kartu Pengakuan</b> + doa penutup. Kumpulkan janji &ldquo;cerita ke 1 orang&rdquo;.</td></tr>'
    + '</table></div></div>'
    + '<div class="guru-blok"><h3>Pertanyaan debrief (pakai yang perlu)</h3><ul>'

    + '<li><b>B2:</b> Kalau harga nyawa tidak bisa dibayar manusia, kenapa Yesus bisa? (Karena Dia tidak berdosa &mdash; orang berdosa tidak bisa mati untuk orang lain.)</li>'

    + '<li><b>B4:</b> Kamu sekarang di tahap mana? Kalau pengudusan seumur hidup, apa yang kamu kerjakan besok?</li>'
    + '<li><b>B5:</b> Apa yang dulu paling penting untukmu, dan sekarang apa? Kalau belum berubah, apa artinya?</li>'
    + '</ul></div>'
    + '<div class="guru-blok"><h3>Kunci jawaban</h3>'

function D(){ return ISI[S.lang] || ISI.id; }

function rupiah(n){
  var d = D();
  if(n >= 1e12) return "Rp " + (n/1e12).toLocaleString(d.locale,{maximumFractionDigits:2}) + d.triliun;
  return "Rp " + Math.round(n).toLocaleString(d.locale);
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

var app = document.getElementById("app");
var layarKini = "beranda";
var hentikan = null; /* pembersih timer babak yang sedang jalan */

function gambarBar(){
  document.getElementById("skor").textContent = S.skor + " pts";
  var B = D().babak, d = "";
  for(var i=0;i<B.length;i++){
    var k = "dot";
    if(S.beres[B[i].id]) k += " on";
    else if(layarKini === B[i].id) k += " now";
    d += '<span class="' + k + '"></span>';
  }
  document.getElementById("dots").innerHTML = d;
  document.getElementById("lang-id").setAttribute("aria-pressed", S.lang === "id" ? "true" : "false");
  document.getElementById("lang-en").setAttribute("aria-pressed", S.lang === "en" ? "true" : "false");
  document.documentElement.lang = S.lang;
  document.getElementById("merek").textContent = D().merek;
}

function ke(layar){
  if(hentikan){ hentikan(); hentikan = null; }
  layarKini = layar;
  window.scrollTo(0,0);
  LAYAR[layar]();
  gambarBar();
}

function gantiBahasa(l){
  if(S.lang === l) return;
  S.lang = l; simpan();
  ke(layarKini);
}
document.getElementById("lang-id").addEventListener("click", function(){ gantiBahasa("id"); });
document.getElementById("lang-en").addEventListener("click", function(){ gantiBahasa("en"); });

function judulBabak(id){
  var B = D().babak;
  for(var i=0;i<B.length;i++) if(B[i].id === id) return B[i].judul;
  return "";
}
function tombolLanjut(tujuan){

}

function pasangNav(){

      '<div class="kartu">'
      + '<p class="eyebrow">' + U.babakKe(1) + '</p>'
      + '<h2>' + B1.judul + '</h2>'
      + '<p class="kecil">' + B1.petunjuk + '</p>'
      + '<div class="perf rumpang">' + t + '</div>'
      + '<div class="kantong">' + kant + '</div>'
      + '</div>'
      + '<div id="aksi1"></div>';

    var slots = app.querySelectorAll("[data-slot]");
    for(var a=0;a<slots.length;a++){
      slots[a].addEventListener("click", function(){
        if(selesai) return;
        var n = +this.getAttribute("data-slot");
        if(isi[n]) isi[n] = "";
        aktif = n;
        gambar();
      });
    }
    var kata = app.querySelectorAll("[data-kata]");
    for(var b=0;b<kata.length;b++){
      kata[b].addEventListener("click", function(){
        if(selesai) return;
        if(aktif < 0){ pesan(B1.ketukDulu); return; }
        isi[aktif] = B1.kantong[+this.getAttribute("data-kata")];
        aktif = -1;
        gambar();
      });
    }
    aksi();
  }

  function tombolCek(){
    return '<button class="tbl" id="cek">' + B1.periksa + '</button>'
      + (cekKe >= 2 ? '<div style="height:10px"></div><button class="tbl merah" id="minta">' + B1.minta + '</button>' : '');
  }
  function pesan(t){
    document.getElementById("aksi1").innerHTML = '<div class="umpan no">' + t + '</div>' + tombolCek();
    pasangAksi();
  }
  function aksi(){
    if(selesai) return;
    document.getElementById("aksi1").innerHTML = tombolCek();
    pasangAksi();
  }
  function pasangAksi(){
    var c = document.getElementById("cek");
    if(c) c.addEventListener("click", function(){
      cekKe++;
      var kosong = 0, salah = 0;
      for(var i=0;i<4;i++){
        if(!isi[i]) kosong++;
        else if(isi[i] !== B1.jawab[i]) salah++;
      }
      if(salah > 0) pesan(B1.salah(salah));
      else if(kosong > 0) pesan(B1.kurang(kosong));
      else menang();
    });
    var mi = document.getElementById("minta");
    if(mi) mi.addEventListener("click", menang);
  }

  function menang(){
    selesai = true;
    var t = "";
    for(var i=0;i<B1.bagian.length;i++){
      var p = B1.bagian[i];
      if(typeof p === "string"){ t += p; }
      else {
        var hadiah = (p === 0 || p === 3);
        t += '<span class="slot ' + (hadiah ? "hadiah" : "isi") + '">' + B1.jawab[p] + '</span>';
      }
    }
    if(!S.beres.b1){ poin(30); tandai("b1"); }
    app.innerHTML =
      '<div class="kartu">'
      + '<p class="eyebrow">' + U.selesai(1) + '</p>'
      + '<div class="rumpang">' + t + '</div>'
      + '<div class="perf">'
      + '<p>' + B1.hasil + '</p>'
      + '<p class="ayat">' + B1.ayat + '</p>'
      + '<div class="umpan ok">' + B1.poin + '</div>'
      + '</div></div>'
      + tombolLanjut("b2") + tombolKembali();
    pasangNav();
  }

  gambar();
};

/* =========================================================
   BABAK 2 — Uang Tebusan (Mzm 49 / 1 Kor 6:19-20)
   ========================================================= */
LAYAR.b2 = function(){
  var d = D(), T = d.b2, U = d.u;
  var TARGET = 9e12;
  var kumpul = 0, ketuk = 0, mulai = 0;

  function gambar(){
    var persen = kumpul / TARGET * 100;
    var lama = mulai ? (Date.now() - mulai) / 1000 : 0;

    var persenTeks = persen.toLocaleString(d.locale, {minimumFractionDigits:7, maximumFractionDigits:7});

    app.innerHTML =
      '<div class="kartu">'

      + '<div class="perf">'
      + '<div class="baris"><span>' + T.harga + '</span><span>' + rupiah(TARGET) + '</span></div>'
      + '<div class="baris"><span>' + T.kumpul + '</span><span>' + rupiah(kumpul) + '</span></div>'
      + '<div class="baris"><span>' + T.kurang + '</span><span style="color:var(--stempel)">' + rupiah(TARGET - kumpul) + '</span></div>'
      + '<div class="bar-progres"><div style="width:' + Math.min(100, persen) + '%"></div></div>'
      + '<p class="kecil rp" style="margin:0">' + T.capai(persenTeks)
      + (ketuk >= 8 ? T.tahun(Math.round(tahun).toLocaleString(d.locale)) : '')
      + '</p>'
      + '</div>'
      + '<div style="height:14px"></div>'
      + '<button class="tbl" id="kumpul" style="padding-block:22px;font-size:18px">' + T.ketuk + '</button>'
      + (ketuk >= 15 ? '<div style="height:10px"></div><button class="tbl garis" id="menyerah">' + T.menyerah + '</button>' : '')
      + '</div>';

    document.getElementById("kumpul").addEventListener("click", function(){
      if(!mulai) mulai = Date.now();
      ketuk++;
      kumpul += 2000 + Math.floor(Math.random() * 6000);
      gambar();
    });
    var my = document.getElementById("menyerah");
    if(my) my.addEventListener("click", akhir);

    if(!S.beres.b2){ poin(20); tandai("b2"); }

      + '<p>' + T.p1 + '</p>'
      + '<p>' + T.p2 + '</p>'

      + '<div class="baris"><span>' + T.tagihan + '</span><span>' + T.tagihanIsi + '</span></div>'
      + '<div class="baris"><span>' + T.oleh + '</span><span>' + T.olehIsi + '</span></div>'
      + '<div class="baris" style="border-bottom:0"><span>' + T.alat + '</span><span>' + T.alatIsi + '</span></div>'
      + '<div class="perf">'
      + '<h3 style="margin-bottom:8px">' + T.duaKata + '</h3>'
      + '<div class="baris"><span><b>' + T.kSel + '</b></span><span style="font-weight:400;text-align:right">' + T.kSelIsi + '</span></div>'
      + '<div class="baris"><span><b>' + T.kTeb + '</b></span><span style="font-weight:400;text-align:right">' + T.kTebIsi + '</span></div>'
      + '<p class="ayat" style="margin-top:14px">' + T.ayat2 + '</p>'

/* =========================================================
   BABAK 5 — Lelang Nilai Hidup (Filipi 3:4-10)
   ========================================================= */
LAYAR.b5 = function(){
  var d = D(), T = d.b5, U = d.u;
  var tawar = S.lelang ? S.lelang.slice() : [0,0,0,0,0,0];
  var MAKS = 100;

  function sisa(){ var s = MAKS; for(var i=0;i<6;i++) s -= tawar[i]; return s; }

  function gambar(){
    var baris = "";
    for(var i=0;i<6;i++){
      baris += '<div class="lelang-baris"><span class="nama">' + T.barang[i] + '</span>'
        + '<span class="stepper">'
        + '<button data-kurang="' + i + '" aria-label="' + T.kurangi + '">&minus;</button>'
        + '<output>' + tawar[i] + '</output>'
        + '<button data-tambah="' + i + '" aria-label="' + T.tambah + '">+</button>'
        + '</span></div>';
    }
    app.innerHTML =
      '<div class="kartu">'
      + '<p class="eyebrow">' + U.babakKe(5) + '</p>'
      + '<h2>' + T.judul + '</h2>'
      + '<p class="kecil">' + T.petunjuk(MAKS) + '</p>'
      + '<div class="perf">' + baris + '</div>'
      + '<div class="baris" style="border-bottom:0;margin-top:8px"><span>' + T.sisa + '</span><span style="color:' + (sisa() === 0 ? "var(--lunas)" : "var(--stempel)") + '">' + sisa() + '</span></div>'
      + '</div>'
      + '<button class="tbl merah" id="palu">' + T.palu + '</button>';

    var tb = app.querySelectorAll("[data-tambah]");
    for(var a=0;a<tb.length;a++) tb[a].addEventListener("click", function(){
      var n = +this.getAttribute("data-tambah");
      if(sisa() >= 5){ tawar[n] += 5; gambar(); }
    });
    var kr = app.querySelectorAll("[data-kurang]");
    for(var b=0;b<kr.length;b++) kr[b].addEventListener("click", function(){
      var n = +this.getAttribute("data-kurang");
      if(tawar[n] >= 5){ tawar[n] -= 5; gambar(); }
    });
    document.getElementById("palu").addEventListener("click", tutup);
  }

  function tutup(){
    S.lelang = tawar.slice(); simpan();
    var pertama = !S.beres.b5;
    if(pertama){ poin(20); tandai("b5"); }
    var duniawi = tawar[0]+tawar[1]+tawar[2]+tawar[3]+tawar[4];
    var kwitansi = "";
    for(var i=0;i<6;i++){
      if(tawar[i] === 0) continue;
      kwitansi += '<div class="baris"><span>' + T.barang[i] + '</span><span>' + tawar[i] + ' pts</span></div>';
    }
    if(!kwitansi) kwitansi = '<div class="baris"><span>' + T.kosong + '</span><span>0 pts</span></div>';
    var paulus = "";
    for(var j=0;j<T.paulusBarang.length;j++){
      paulus += '<div class="baris"><span>' + T.paulusBarang[j] + '</span><span class="cap rugi">' + T.rugi + '</span></div>';
    }

    app.innerHTML =
      '<div class="kartu">'
      + '<p class="eyebrow">' + T.kwitansi(S.nama ? esc(S.nama) : "") + '</p>'
      + kwitansi
      + '<div class="perf"><p class="kecil" style="margin:0">' + T.banding(duniawi, tawar[5]) + '</p></div>'
      + '</div>'
      + '<div class="kartu">'
      + '<p class="eyebrow">' + T.paulus + '</p>'
      + '<p class="kecil" style="margin-bottom:12px">' + T.paulusIntro + '</p>'
      + paulus
      + '<div class="baris" style="border-bottom:0"><span><b>' + T.paulusKristus + '</b></span><span class="cap untung">' + T.untung + '</span></div>'
      + '<p class="ayat" style="margin-top:14px">' + T.ayat + '</p>'
      + '<div class="perf">'
      + '<h3 style="margin-bottom:8px">' + T.tanda + '</h3>'
      + daftarLi(T.tandaIsi)
      + '<p class="kecil">' + T.tanya + '</p>'
      + (pertama ? '<div class="umpan ok">' + T.poin + '</div>' : '')
      + '</div></div>'
      + tombolLanjut("b6") + tombolKembali();
    pasangNav();
  }

  gambar();
};

LAYAR.b6 = function(){
  var d = D(), T = d.b6, U = d.u, Q = T.soal;
  var i = 0, benar = 0, nilai = 0, waktu = null, sisaDetik = 15;
  hentikan = function(){ clearInterval(waktu); };

  function gambar(){
    if(i >= Q.length) return tutup();
    var s = Q[i];
    sisaDetik = 15;
    var pil = "";
    for(var x=0;x<s.p.length;x++) pil += '<button class="pil" data-j="' + x + '">' + s.p[x] + '</button>';
    app.innerHTML =
      '<div class="kartu">'
      + '<p class="eyebrow">' + T.ke(i+1, Q.length, benar) + '</p>'
      + '<div class="bar-progres"><div id="jam" style="width:100%;transition:width 1s linear"></div></div>'
      + '<p style="font-size:17px;line-height:1.45;margin-bottom:14px">' + s.t + '</p>'
      + pil + '</div>';
    var b = app.querySelectorAll("[data-j]");
    for(var y=0;y<b.length;y++) b[y].addEventListener("click", function(){ jawab(+this.getAttribute("data-j")); });
    clearInterval(waktu);
    waktu = setInterval(function(){
      sisaDetik--;
      var j = document.getElementById("jam");
      if(j) j.style.width = Math.max(0, sisaDetik/15*100) + "%";
      if(sisaDetik <= 0){ clearInterval(waktu); jawab(-1); }
    }, 1000);
  }

  function jawab(p){
    clearInterval(waktu);
    var s = Q[i], ok = (p === s.b);
    if(ok){ benar++; nilai += 10 + Math.max(0, Math.round(sisaDetik/3)); }
    var pil = "";
    for(var x=0;x<s.p.length;x++){
      var kls = "pil";
      if(x === s.b) kls += " benar";
      else if(x === p) kls += " salah";
      pil += '<div class="' + kls + '">' + s.p[x] + '</div>';
    }
    app.innerHTML =
      '<div class="kartu">'
      + '<p class="eyebrow">' + T.keSaja(i+1, Q.length) + '</p>'
      + '<p style="font-size:17px;line-height:1.45;margin-bottom:14px">' + s.t + '</p>'
      + pil
      + '<div class="umpan ' + (ok ? "ok" : "no") + '" style="margin-top:12px"><b>'
      + (ok ? U.BENAR : (p === -1 ? U.HABIS : U.SALAH)) + '.</b> ' + (ok ? T.cepat : T.hijau) + '</div>'
      + '<button class="tbl" id="next">' + (i === Q.length-1 ? T.hasilAkhir : T.soalBerikut) + '</button>'
      + '</div>';
    document.getElementById("next").addEventListener("click", function(){ i++; gambar(); });
  }

  function tutup(){
    var pertama = !S.beres.b6;
    if(pertama){ poin(nilai); tandai("b6"); }
    app.innerHTML =
      '<div class="kartu">'
      + '<p class="eyebrow">' + U.selesai(6) + '</p>'
      + '<h2>' + U.benarDari(benar, Q.length) + '</h2>'
      + (pertama ? '<div class="umpan ok">' + T.bonus(nilai) + '</div>' : '')
      + '<div class="perf">'
      + '<p><b>' + T.kesimpulan + '</b></p>'
      + daftarLi(T.kesimpulanIsi)
      + '<p class="ayat">' + T.ayat + '</p>'
      + '</div></div>'
      + '<button class="tbl" data-ke="kartu">' + T.keKartu + '</button>'
      + tombolKembali();
    pasangNav();
  }
  gambar();
};

      + '</div></div>'
      + '<button class="tbl" id="ss">' + T.ss + '</button>'
      + tombolKembali();
    pasangNav();
    document.getElementById("ss").addEventListener("click", function(){
      this.textContent = T.ssSiap;
      this.disabled = true;
    });
  });
};
